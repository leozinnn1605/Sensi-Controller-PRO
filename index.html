<script>
  const DEFAULT_CONFIG = {
    reaisPorUnidade: 5,
    bitsPorUnidade: 100,
    variacaoPorUnidade: 0.05,
    sensiMin: 0.00,
    sensiMax: 2.25,
    sensiInicial: 0.000,
    permitirFracionado: true,
    limparValorAposAplicar: true,
    manterNickPreenchido: true,
    messageTemplate: "{nick} • {doacao} • {acao} {sinal}{variacao} • sensi atual {sensi}",
    rouletteEnabled: false,
    rouletteTriggerType: "pix",
    rouletteTriggerValue: 50,
    rouletteDurationSec: 60,
    rouletteDurationValue: 60,
    rouletteDurationUnit: "sec",
    rouletteMultipliers: "0.5, 1.5, 2, 3"
  };

  let config = carregarConfig();
  const historySelection = new Set();

  let sensi = parseFloat(localStorage.getItem("sensiAtual"));
  if (!Number.isFinite(sensi)) sensi = Number(config.sensiInicial);

  let sensiAnterior = parseFloat(localStorage.getItem("sensiAnterior"));
  if (!Number.isFinite(sensiAnterior)) sensiAnterior = sensi;

  let rouletteState = carregarRoletaAtiva();
  let rouletteCurrentRotation = Number(sessionStorage.getItem("rouletteCurrentRotation") || "0");
  let rouletteIsSpinning = false;
  let rouletteSpinToken = 0;

  const atualEl = document.getElementById("atual");
  const anteriorEl = document.getElementById("anterior");
  const previewUpValueEl = document.getElementById("previewUpValue");
  const previewDownValueEl = document.getElementById("previewDownValue");
  const previewUpSubEl = document.getElementById("previewUpSub");
  const previewDownSubEl = document.getElementById("previewDownSub");
  const previewLineEl = document.getElementById("previewLine");
  const previewIdleEl = document.getElementById("previewIdle");
  const rulesLineEl = document.getElementById("rulesLine");
  const pillPixEl = document.getElementById("pillPix");
  const pillBitsEl = document.getElementById("pillBits");
  const pillTotalLiveEl = document.getElementById("pillTotalLive");
  const pillCountLiveEl = document.getElementById("pillCountLive");
  const pillUpDownLiveEl = document.getElementById("pillUpDownLive");
  const statusTextEl = document.getElementById("statusText");
  const rouletteActiveBarEl = document.getElementById("rouletteActiveBar");
  const rouletteActiveTextEl = document.getElementById("rouletteActiveText");

  const rouletteWheelEl = document.getElementById("rouletteWheel");
  const rouletteLabelsEl = document.getElementById("rouletteLabels");
  const rouletteCenterBadgeEl = document.getElementById("rouletteCenterBadge");
  const rouletteTriggerInfoEl = document.getElementById("rouletteTriggerInfo");
  const rouletteStatusInfoEl = document.getElementById("rouletteStatusInfo");
  const rouletteListEl = document.getElementById("rouletteList");
  const rouletteWheelWrapEl = document.getElementById("rouletteWheelWrap");

  const tituloLiveInput = document.getElementById("tituloLiveInput");
  const liveTitleDisplay = document.getElementById("liveTitleDisplay");
  const liveSetup = document.getElementById("liveSetup");
  const saveLiveBtn = document.getElementById("saveLiveBtn");
  const editLiveBtn = document.getElementById("editLiveBtn");

  const nickEl = document.getElementById("nick");
  const valorEl = document.getElementById("valor");
  const tipoEl = document.getElementById("tipo");
  const manualSensiInputEl = document.getElementById("manualSensiInput");

  const overlayEl = document.getElementById("overlay");
  const settingsPanelEl = document.getElementById("settingsPanel");
  const historyPanelEl = document.getElementById("historyPanel");
  const rankingPanelEl = document.getElementById("rankingPanel");
  const historyListEl = document.getElementById("historyList");
  const rankingContentEl = document.getElementById("rankingContent");
  const toastEl = document.getElementById("toast");

  const miniPlayerEl = document.getElementById("miniPlayer");
  const miniPlayerHeadEl = document.getElementById("miniPlayerHead");
  const miniPlayerSensiEl = document.getElementById("miniPlayerSensi");
  const miniPlayerLastEl = document.getElementById("miniPlayerLast");

  function normalizeConfig(cfg) {
    const merged = { ...DEFAULT_CONFIG, ...(cfg || {}) };

    if (!("rouletteDurationValue" in merged) || !("rouletteDurationUnit" in merged)) {
      const sec = Number(merged.rouletteDurationSec || 60);
      if (sec % 60 === 0 && sec >= 60) {
        merged.rouletteDurationValue = sec / 60;
        merged.rouletteDurationUnit = "min";
      } else {
        merged.rouletteDurationValue = sec;
        merged.rouletteDurationUnit = "sec";
      }
    }

    merged.rouletteDurationSec = getRouletteDurationSecFromConfig(merged);
    return merged;
  }

  function carregarConfig() {
    const salva = JSON.parse(localStorage.getItem("configSensi") || "null");
    return normalizeConfig(salva);
  }

  function salvarConfig(novaConfig) {
    localStorage.setItem("configSensi", JSON.stringify(novaConfig));
  }

  function carregarHistorico() {
    return JSON.parse(localStorage.getItem("historico") || "[]");
  }

  function salvarHistoricoCompleto(historico) {
    localStorage.setItem("historico", JSON.stringify(historico));
  }

  function carregarUndoStack() {
    return JSON.parse(sessionStorage.getItem("undoStackSensi") || "[]");
  }

  function salvarUndoStack(stack) {
    sessionStorage.setItem("undoStackSensi", JSON.stringify(stack));
  }

  function carregarRedoStack() {
    return JSON.parse(sessionStorage.getItem("redoStackSensi") || "[]");
  }

  function salvarRedoStack(stack) {
    sessionStorage.setItem("redoStackSensi", JSON.stringify(stack));
  }

  function carregarPresets() {
    return JSON.parse(localStorage.getItem("presetsSensi") || "[]");
  }

  function salvarPresets(presets) {
    localStorage.setItem("presetsSensi", JSON.stringify(presets));
  }

  function carregarRoletaAtiva() {
    const state = JSON.parse(localStorage.getItem("rouletteStateSensi") || "null");
    if (!state) return null;
    if (!state.endsAt || Date.now() >= state.endsAt) {
      localStorage.removeItem("rouletteStateSensi");
      return null;
    }
    return state;
  }

  function salvarRoletaAtiva(state) {
    rouletteState = state;
    if (state) localStorage.setItem("rouletteStateSensi", JSON.stringify(state));
    else localStorage.removeItem("rouletteStateSensi");
    renderRoletaAtiva();
    renderRoulettePanel();
  }

  function format3(value) {
    return Number(value).toFixed(3);
  }

  function formatMoney(value) {
    return Number(value).toFixed(2).replace(".", ",");
  }

  function formatRemaining(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    if (min > 0) return `${min}m ${sec}s`;
    return `${sec}s`;
  }

  function getRouletteDurationSecFromConfig(cfg) {
    const value = Number(cfg.rouletteDurationValue ?? cfg.rouletteDurationSec ?? 60);
    const unit = cfg.rouletteDurationUnit || "sec";
    const seconds = unit === "min" ? value * 60 : value;
    return Math.max(1, Math.round(seconds));
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showToast(texto) {
    toastEl.textContent = texto;
    toastEl.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      toastEl.classList.remove("show");
    }, 1800);
  }

  function atualizarMiniPlayer() {
    miniPlayerSensiEl.textContent = format3(sensi);
    miniPlayerLastEl.textContent = statusTextEl.textContent || "Nenhuma alteração aplicada ainda.";
  }

  function renderSensi() {
    atualEl.textContent = format3(Number(sensi));
    anteriorEl.textContent = format3(Number(sensiAnterior));
    atualizarMiniPlayer();
  }

  function atualizarCardsSensi(sensiNova, sensiAntiga) {
    sensi = Number(sensiNova.toFixed(3));
    sensiAnterior = Number(sensiAntiga.toFixed(3));

    atualEl.textContent = format3(sensi);
    anteriorEl.textContent = format3(sensiAnterior);

    localStorage.setItem("sensiAtual", String(sensi));
    localStorage.setItem("sensiAnterior", String(sensiAnterior));
    atualizarMiniPlayer();
  }

  function resetarSensi() {
    const confirmar = confirm("Deseja resetar a sensi atual e a anterior para 0.000?");
    if (!confirmar) return;

    sensi = 0;
    sensiAnterior = 0;

    localStorage.setItem("sensiAtual", String(sensi));
    localStorage.setItem("sensiAnterior", String(sensiAnterior));

    renderSensi();
    statusTextEl.textContent = "Sensi resetada para 0.000.";
    atualizarPreview();
    atualizarMiniPlayer();
    showToast("Sensi resetada");
  }

  function renderRegras() {
    rulesLineEl.textContent =
      `Mín: ${format3(config.sensiMin)} • Máx: ${format3(config.sensiMax)} • Cada unidade muda ${format3(config.variacaoPorUnidade)}`;

    pillPixEl.textContent = `💰 A cada R$${formatMoney(config.reaisPorUnidade)} = ${format3(config.variacaoPorUnidade)}`;
    pillBitsEl.textContent = `💎 A cada ${Number(config.bitsPorUnidade)} bits = ${format3(config.variacaoPorUnidade)}`;
  }

  function renderTituloLive() {
    const titulo = localStorage.getItem("tituloLive") || "";
    if (titulo.trim()) {
      liveTitleDisplay.textContent = titulo;
      liveSetup.classList.add("hidden");
      editLiveBtn.style.display = "inline-block";
    } else {
      liveTitleDisplay.textContent = "Nenhuma live definida";
      liveSetup.classList.remove("hidden");
      editLiveBtn.style.display = "none";
    }
    atualizarResumoLiveAtual();
  }

  function salvarTituloLive() {
    const titulo = tituloLiveInput.value.trim();
    if (!titulo) {
      alert("Digite o título da live.");
      return;
    }
    localStorage.setItem("tituloLive", titulo);
    tituloLiveInput.value = "";
    renderTituloLive();
    renderHistory();
    renderRanking();
  }

  function abrirOverlay() {
    overlayEl.classList.add("show");
  }

  function fecharOverlaySeNecessario() {
    const historyOpen = historyPanelEl.classList.contains("show");
    const settingsOpen = settingsPanelEl.classList.contains("show");
    const rankingOpen = rankingPanelEl.classList.contains("show");
    if (!historyOpen && !settingsOpen && !rankingOpen) {
      overlayEl.classList.remove("show");
    }
  }

  function abrirSettings() {
    preencherFormularioConfig();
    renderPresetOptions();
    abrirOverlay();
    settingsPanelEl.classList.add("show");
    settingsPanelEl.setAttribute("aria-hidden", "false");
  }

  function fecharSettings() {
    settingsPanelEl.classList.remove("show");
    settingsPanelEl.setAttribute("aria-hidden", "true");
    fecharOverlaySeNecessario();
  }

  function abrirHistorico() {
    renderHistory();
    abrirOverlay();
    historyPanelEl.classList.add("show");
    historyPanelEl.setAttribute("aria-hidden", "false");
  }

  function fecharHistorico() {
    historyPanelEl.classList.remove("show");
    historyPanelEl.setAttribute("aria-hidden", "true");
    fecharOverlaySeNecessario();
  }

  function abrirRanking() {
    renderRanking();
    abrirOverlay();
    rankingPanelEl.classList.add("show");
    rankingPanelEl.setAttribute("aria-hidden", "false");
  }

  function fecharRanking() {
    rankingPanelEl.classList.remove("show");
    rankingPanelEl.setAttribute("aria-hidden", "true");
    fecharOverlaySeNecessario();
  }

  function fecharTudo() {
    fecharHistorico();
    fecharSettings();
    fecharRanking();
  }

  function preencherFormularioConfig() {
    document.getElementById("cfgReaisPorUnidade").value = config.reaisPorUnidade;
    document.getElementById("cfgBitsPorUnidade").value = config.bitsPorUnidade;
    document.getElementById("cfgVariacaoPorUnidade").value = config.variacaoPorUnidade;
    document.getElementById("cfgSensiInicial").value = config.sensiInicial;
    document.getElementById("cfgSensiMin").value = config.sensiMin;
    document.getElementById("cfgSensiMax").value = config.sensiMax;
    document.getElementById("cfgPermitirFracionado").checked = !!config.permitirFracionado;
    document.getElementById("cfgLimparValor").checked = !!config.limparValorAposAplicar;
    document.getElementById("cfgManterNick").checked = !!config.manterNickPreenchido;
    document.getElementById("cfgMessageTemplate").value = config.messageTemplate || DEFAULT_CONFIG.messageTemplate;

    document.getElementById("cfgRouletteEnabled").checked = !!config.rouletteEnabled;
    document.getElementById("cfgRouletteTriggerType").value = config.rouletteTriggerType || "pix";
    document.getElementById("cfgRouletteTriggerValue").value = config.rouletteTriggerValue ?? 50;
    document.getElementById("cfgRouletteDurationValue").value = config.rouletteDurationValue ?? 60;
    document.getElementById("cfgRouletteDurationUnit").value = config.rouletteDurationUnit || "sec";
    document.getElementById("cfgRouletteMultipliers").value = config.rouletteMultipliers || "0.5, 1.5, 2, 3";
  }

  function lerFormularioConfig() {
    const durationValue = parseFloat(document.getElementById("cfgRouletteDurationValue").value);
    const durationUnit = document.getElementById("cfgRouletteDurationUnit").value;

    const nova = {
      reaisPorUnidade: parseFloat(document.getElementById("cfgReaisPorUnidade").value),
      bitsPorUnidade: parseFloat(document.getElementById("cfgBitsPorUnidade").value),
      variacaoPorUnidade: parseFloat(document.getElementById("cfgVariacaoPorUnidade").value),
      sensiInicial: parseFloat(document.getElementById("cfgSensiInicial").value),
      sensiMin: parseFloat(document.getElementById("cfgSensiMin").value),
      sensiMax: parseFloat(document.getElementById("cfgSensiMax").value),
      permitirFracionado: document.getElementById("cfgPermitirFracionado").checked,
      limparValorAposAplicar: document.getElementById("cfgLimparValor").checked,
      manterNickPreenchido: document.getElementById("cfgManterNick").checked,
      messageTemplate: document.getElementById("cfgMessageTemplate").value.trim() || DEFAULT_CONFIG.messageTemplate,
      rouletteEnabled: document.getElementById("cfgRouletteEnabled").checked,
      rouletteTriggerType: document.getElementById("cfgRouletteTriggerType").value,
      rouletteTriggerValue: parseFloat(document.getElementById("cfgRouletteTriggerValue").value),
      rouletteDurationValue: durationValue,
      rouletteDurationUnit: durationUnit,
      rouletteMultipliers: document.getElementById("cfgRouletteMultipliers").value.trim()
    };

    nova.rouletteDurationSec = getRouletteDurationSecFromConfig(nova);

    if (!Number.isFinite(nova.reaisPorUnidade) || nova.reaisPorUnidade <= 0) throw new Error("R$ por unidade inválido.");
    if (!Number.isFinite(nova.bitsPorUnidade) || nova.bitsPorUnidade <= 0) throw new Error("Bits por unidade inválido.");
    if (!Number.isFinite(nova.variacaoPorUnidade) || nova.variacaoPorUnidade <= 0) throw new Error("Variação da sensi inválida.");
    if (!Number.isFinite(nova.sensiInicial) || nova.sensiInicial < 0) throw new Error("Sensi inicial inválida.");
    if (!Number.isFinite(nova.sensiMin) || nova.sensiMin < 0) throw new Error("Sensi mínima inválida.");
    if (!Number.isFinite(nova.sensiMax) || nova.sensiMax <= 0) throw new Error("Sensi máxima inválida.");
    if (nova.sensiMax < nova.sensiMin) throw new Error("A sensi máxima não pode ser menor que a mínima.");

    if (nova.rouletteEnabled) {
      if (!Number.isFinite(nova.rouletteTriggerValue) || nova.rouletteTriggerValue <= 0) {
        throw new Error("Valor do gatilho da roleta inválido.");
      }
      if (!Number.isFinite(durationValue) || durationValue <= 0) {
        throw new Error("Duração da roleta inválida.");
      }
      if (!Number.isFinite(nova.rouletteDurationSec) || nova.rouletteDurationSec < 1) {
        throw new Error("Duração final da roleta inválida.");
      }
      const mults = parseMultipliers(nova.rouletteMultipliers);
      if (!mults.length) {
        throw new Error("Digite multiplicadores válidos para a roleta.");
      }
    }

    return normalizeConfig(nova);
  }

  function aplicarNovaConfig() {
    try {
      const nova = lerFormularioConfig();
      config = nova;
      salvarConfig(config);

      const usarSensiInicial = Number(config.sensiInicial.toFixed(3));
      sensi = usarSensiInicial;
      sensiAnterior = usarSensiInicial;

      localStorage.setItem("sensiAtual", String(sensi));
      localStorage.setItem("sensiAnterior", String(sensiAnterior));

      renderSensi();
      renderRegras();
      atualizarPreview();
      renderRoletaAtiva();
      renderRoulettePanel();
      fecharSettings();
      statusTextEl.textContent = `Configurações salvas. Sensi atual definida para ${format3(sensi)}.`;
      atualizarMiniPlayer();
      showToast("Configurações salvas");
    } catch (erro) {
      alert(erro.message);
    }
  }

  function parseMultipliers(text) {
    return String(text)
      .split(",")
      .map(v => parseFloat(v.trim().replace(",", ".")))
      .filter(v => Number.isFinite(v) && v > 0);
  }

  function getRoletaMultiplierAtual() {
    if (!rouletteState) return 1;
    if (Date.now() >= rouletteState.endsAt) {
      salvarRoletaAtiva(null);
      return 1;
    }
    return Number(rouletteState.multiplier || 1);
  }

  function buildRouletteGradient(mults) {
    if (!mults.length) {
      return "conic-gradient(from -90deg, rgba(255,255,255,0.08) 0deg 360deg)";
    }

    const palette = [
      "#0ea5e9", "#14b8a6", "#8b5cf6", "#ec4899",
      "#f59e0b", "#ef4444", "#6366f1", "#22c55e",
      "#06b6d4", "#f97316", "#a855f7", "#10b981"
    ];

    const step = 360 / mults.length;
    const parts = mults.map((_, i) => {
      const start = i * step;
      const end = start + step;
      return `${palette[i % palette.length]} ${start}deg ${end}deg`;
    });

    return `conic-gradient(from -90deg, ${parts.join(", ")})`;
  }

  function renderRouletteLabels(mults) {
    rouletteLabelsEl.innerHTML = "";
    if (!mults.length) return;

    const step = 360 / mults.length;
    const radius = mults.length >= 8 ? 92 : 104;

    mults.forEach((mult, i) => {
      const angle = i * step + step / 2;
      const label = document.createElement("div");
      label.className = "roulette-label";
      label.textContent = `${Number(mult).toFixed(2)}x`;
      label.style.transform = `
        translate(-50%, -50%)
        rotate(${angle}deg)
        translateY(-${radius}px)
        rotate(${-angle}deg)
      `;
      rouletteLabelsEl.appendChild(label);
    });
  }

  function applyRouletteRotation(rotation, withTransition = true) {
    const transition = withTransition ? "transform 5.4s cubic-bezier(0.12, 0.88, 0.15, 1)" : "none";
    rouletteWheelEl.style.transition = transition;
    rouletteLabelsEl.style.transition = transition;
    rouletteWheelEl.style.transform = `rotate(${rotation}deg)`;
    rouletteLabelsEl.style.transform = `rotate(${rotation}deg)`;
  }

  function renderRoulettePanel() {
    const mults = parseMultipliers(config.rouletteMultipliers);
    rouletteWheelEl.style.background = buildRouletteGradient(mults);
    applyRouletteRotation(rouletteCurrentRotation, !rouletteIsSpinning ? false : true);
    renderRouletteLabels(mults);

    if (!config.rouletteEnabled) {
      rouletteTriggerInfoEl.textContent = "Desativada";
    } else {
      const gatilhoTexto = config.rouletteTriggerType === "bits"
        ? `${Number(config.rouletteTriggerValue)} bits`
        : `R$${formatMoney(config.rouletteTriggerValue)}`;

      rouletteTriggerInfoEl.textContent =
        `${config.rouletteTriggerType === "bits" ? "Bits" : "PIX"} exato ${gatilhoTexto} • duração ${config.rouletteDurationUnit === "min" ? `${config.rouletteDurationValue} min` : `${config.rouletteDurationValue} s`}`;
    }

    const activeMult = getRoletaMultiplierAtual();
    if (rouletteIsSpinning) {
      rouletteCenterBadgeEl.innerHTML = "girando...";
      rouletteWheelWrapEl.classList.add("spin-glow");
    } else if (rouletteState && activeMult !== 1) {
      rouletteCenterBadgeEl.innerHTML = `${Number(activeMult).toFixed(2)}x<br>ativo`;
      rouletteWheelWrapEl.classList.remove("spin-glow");
    } else {
      rouletteCenterBadgeEl.innerHTML = config.rouletteEnabled ? "pronta<br>pra girar" : "roleta<br>off";
      rouletteWheelWrapEl.classList.remove("spin-glow");
    }

    const remaining = rouletteState ? Math.max(0, rouletteState.endsAt - Date.now()) : 0;
    rouletteStatusInfoEl.textContent =
      rouletteState && activeMult !== 1
        ? `Multiplicador ${Number(activeMult).toFixed(2)}x ativo por mais ${formatRemaining(remaining)}.`
        : "Nenhum multiplicador ativo.";

    rouletteListEl.innerHTML = mults.length
      ? mults.map(mult => `
          <div class="roulette-list-item ${rouletteState && Number(mult) === Number(rouletteState.multiplier) ? "active" : ""}">
            <span>Multiplicador</span>
            <strong>${Number(mult).toFixed(2)}x</strong>
          </div>
        `).join("")
      : `<div class="history-empty">Sem multiplicadores definidos.</div>`;
  }

  function renderRoletaAtiva() {
    const mult = getRoletaMultiplierAtual();
    if (mult === 1 || !rouletteState) {
      rouletteActiveBarEl.classList.remove("show");
      rouletteActiveTextEl.textContent = "";
      renderRoulettePanel();
      return;
    }

    const restanteMs = Math.max(0, rouletteState.endsAt - Date.now());
    rouletteActiveBarEl.classList.add("show");
    rouletteActiveTextEl.textContent = `Multiplicador ${rouletteState.multiplier.toFixed(2)}x ativo por mais ${formatRemaining(restanteMs)}.`;
    renderRoulettePanel();
  }

  function interromperRoleta() {
    const haviaAlgo = rouletteIsSpinning || !!rouletteState;

    rouletteSpinToken++;
    clearTimeout(girarRoletaVisual._timer);
    rouletteIsSpinning = false;

    rouletteCurrentRotation = rouletteCurrentRotation % 360;
    sessionStorage.setItem("rouletteCurrentRotation", String(rouletteCurrentRotation));
    applyRouletteRotation(rouletteCurrentRotation, false);

    salvarRoletaAtiva(null);

    statusTextEl.textContent = "Roleta interrompida manualmente.";
    atualizarMiniPlayer();

    if (haviaAlgo) showToast("Roleta interrompida");
    else showToast("Nenhuma roleta ativa");
  }

  function ativarRoletaPorDoacao(nick, valor, tipoDoacao) {
    const mults = parseMultipliers(config.rouletteMultipliers);
    if (!mults.length) return null;

    const selectedIndex = Math.floor(Math.random() * mults.length);
    const sorteado = mults[selectedIndex];
    const endsAt = Date.now() + (Number(config.rouletteDurationSec) * 1000);

    girarRoletaVisual(selectedIndex, mults.length, () => {
      salvarRoletaAtiva({
        multiplier: sorteado,
        endsAt,
        activatedBy: nick,
        triggerValue: valor,
        triggerType: tipoDoacao
      });

      statusTextEl.textContent = `${nick} ativou a roleta com ${montarDoacaoTexto(valor, tipoDoacao)} • multiplicador sorteado: ${Number(sorteado).toFixed(2)}x por ${formatRemaining(config.rouletteDurationSec * 1000)}`;
      atualizarMiniPlayer();
      showToast(`Roleta: ${Number(sorteado).toFixed(2)}x`);
    });

    return sorteado;
  }

  function girarRoletaVisual(selectedIndex, totalItems, onFinish) {
    if (!totalItems) {
      if (typeof onFinish === "function") onFinish();
      return;
    }

    rouletteIsSpinning = true;
    const myToken = ++rouletteSpinToken;
    renderRoulettePanel();

    const step = 360 / totalItems;
    const centerAngle = selectedIndex * step + step / 2;
    const targetOffset = 360 - centerAngle;
    const extraTurns = 360 * (5 + Math.floor(Math.random() * 2));

    rouletteCurrentRotation = rouletteCurrentRotation + extraTurns + targetOffset + 90;
    sessionStorage.setItem("rouletteCurrentRotation", String(rouletteCurrentRotation));

    applyRouletteRotation(rouletteCurrentRotation, true);

    clearTimeout(girarRoletaVisual._timer);
    girarRoletaVisual._timer = setTimeout(() => {
      if (myToken !== rouletteSpinToken) return;

      rouletteIsSpinning = false;
      renderRoulettePanel();
      if (typeof onFinish === "function") onFinish();
    }, 5450);
  }

  function calcularVariacao(valor, tipoDoacao) {
    let unidades;

    if (tipoDoacao === "bits") unidades = valor / config.bitsPorUnidade;
    else unidades = valor / config.reaisPorUnidade;

    if (!config.permitirFracionado) unidades = Math.floor(unidades);

    const multiplicadorAtivo = getRoletaMultiplierAtual();
    return unidades * config.variacaoPorUnidade * multiplicadorAtivo;
  }

  function doacaoAtivaRoleta(valor, tipoDoacao) {
    if (!config.rouletteEnabled) return false;
    if (tipoDoacao !== config.rouletteTriggerType) return false;

    const valorNumero = Number(valor);
    const gatilho = Number(config.rouletteTriggerValue);

    if (!Number.isFinite(valorNumero) || !Number.isFinite(gatilho)) return false;

    return Math.abs(valorNumero - gatilho) < 0.000001;
  }

  function montarDoacaoTexto(valor, tipoDoacao) {
    return tipoDoacao === "bits"
      ? `💎 ${valor} bits`
      : `💰 R$${Number(valor).toFixed(2).replace(".", ",")}`;
  }

  function gerarMensagem({ nick, valor, tipoDoacao, direcao, variacao, sensiFinal, sensiAntes }) {
    const doacaoTexto = montarDoacaoTexto(valor, tipoDoacao);
    const acao = direcao === "up" ? "subiu" : "desceu";
    const sinal = direcao === "up" ? "+" : "-";
    const template = config.messageTemplate || DEFAULT_CONFIG.messageTemplate;

    return template
      .replaceAll("{nick}", nick)
      .replaceAll("{doacao}", doacaoTexto)
      .replaceAll("{acao}", acao)
      .replaceAll("{sinal}", sinal)
      .replaceAll("{variacao}", format3(variacao))
      .replaceAll("{sensi}", format3(sensiFinal))
      .replaceAll("{antes}", format3(sensiAntes));
  }

  function getCurrentLiveInfo() {
    return {
      titulo: localStorage.getItem("tituloLive") || "Sem título",
      data: new Date().toLocaleDateString("pt-BR")
    };
  }

  function findCurrentLive(historico) {
    const info = getCurrentLiveInfo();
    return historico.find(item => item.titulo === info.titulo && item.data === info.data);
  }

  function atualizarResumoLiveAtual() {
    const historico = carregarHistorico();
    const live = findCurrentLive(historico);

    if (!live || !(live.registros || []).length) {
      pillTotalLiveEl.textContent = "📈 Live atual: sem registros";
      pillCountLiveEl.textContent = "🔢 Alterações: 0";
      pillUpDownLiveEl.textContent = "⬆️ 0 • ⬇️ 0";
      return;
    }

    let totalPix = 0;
    let totalBits = 0;
    let ups = 0;
    let downs = 0;

    live.registros.forEach(r => {
      if (r.origem !== "manual" && r.origem !== "roulette_trigger") {
        if (r.tipoDoacao === "bits") totalBits += Number(r.valor);
        else totalPix += Number(r.valor);
      }

      if (r.direcao === "up") ups++;
      else if (r.direcao === "down") downs++;
    });

    pillTotalLiveEl.textContent = `📈 Live atual: R$${formatMoney(totalPix)} • ${totalBits} bits`;
    pillCountLiveEl.textContent = `🔢 Alterações: ${live.registros.length}`;
    pillUpDownLiveEl.textContent = `⬆️ ${ups} • ⬇️ ${downs}`;
  }

  function salvarRegistroNoHistorico({ nick, valor, tipoDoacao, direcao, variacao, sensiAntes, sensiFinal, origem = "doacao" }) {
    const historico = carregarHistorico();
    const { titulo, data } = getCurrentLiveInfo();

    const registro = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      nick,
      valor: Number(valor),
      tipoDoacao,
      direcao,
      variacao: Number((variacao || 0).toFixed(3)),
      sensiAntes: Number((sensiAntes || 0).toFixed(3)),
      sensiFinal: Number((sensiFinal || 0).toFixed(3)),
      dataHora: new Date().toLocaleString("pt-BR"),
      origem
    };

    let live = historico.find(item => item.titulo === titulo && item.data === data);

    if (!live) {
      live = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        titulo,
        data,
        registros: []
      };
      historico.unshift(live);
    }

    live.registros.unshift(registro);
    salvarHistoricoCompleto(historico);
    atualizarResumoLiveAtual();
    return { registro, titulo, data };
  }

  function inserirRegistroNoHistoricoExistente(registro, titulo, data) {
    const historico = carregarHistorico();
    let live = historico.find(item => item.titulo === titulo && item.data === data);

    if (!live) {
      live = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        titulo,
        data,
        registros: []
      };
      historico.unshift(live);
    }

    live.registros.unshift(registro);
    salvarHistoricoCompleto(historico);
    atualizarResumoLiveAtual();
  }

  function removerRegistroPorId(idRegistro) {
    const historico = carregarHistorico();

    for (let i = 0; i < historico.length; i++) {
      const live = historico[i];
      const idx = (live.registros || []).findIndex(r => r.id === idRegistro);
      if (idx !== -1) {
        live.registros.splice(idx, 1);
        historySelection.delete(String(idRegistro));
        if (!live.registros.length) historico.splice(i, 1);
        salvarHistoricoCompleto(historico);
        atualizarResumoLiveAtual();
        return true;
      }
    }
    return false;
  }

  function removerLivePorId(liveId) {
    const historico = carregarHistorico();
    const idx = historico.findIndex(l => l.id === liveId);
    if (idx === -1) return false;

    (historico[idx].registros || []).forEach(r => historySelection.delete(String(r.id)));
    historico.splice(idx, 1);
    salvarHistoricoCompleto(historico);
    atualizarResumoLiveAtual();
    return true;
  }

  function removerRegistrosSelecionadosDaLive(liveId) {
    const historico = carregarHistorico();
    const live = historico.find(l => l.id === liveId);
    if (!live) return 0;

    const antes = live.registros.length;
    live.registros = live.registros.filter(r => !historySelection.has(String(r.id)));
    const removidos = antes - live.registros.length;

    if (!live.registros.length) {
      const idx = historico.findIndex(l => l.id === liveId);
      if (idx !== -1) historico.splice(idx, 1);
    }

    salvarHistoricoCompleto(historico);
    atualizarResumoLiveAtual();
    return removidos;
  }

  function pushUndoAction(acao) {
    const undo = carregarUndoStack();
    undo.push(acao);
    salvarUndoStack(undo);
    salvarRedoStack([]);
  }

  function aplicarMudanca(direcao) {
    const titulo = localStorage.getItem("tituloLive");
    if (!titulo) {
      alert("Defina o título da live primeiro.");
      return;
    }

    const nick = nickEl.value.trim() || "Anônimo";
    const valor = parseFloat(valorEl.value);
    const tipoDoacao = tipoEl.value;

    if (!Number.isFinite(valor) || valor <= 0) {
      alert("Digite um valor válido.");
      return;
    }

    if (doacaoAtivaRoleta(valor, tipoDoacao)) {
      const resultado = salvarRegistroNoHistorico({
        nick,
        valor,
        tipoDoacao,
        direcao: "up",
        variacao: 0,
        sensiAntes: sensi,
        sensiFinal: sensi,
        origem: "roulette_trigger"
      });

      pushUndoAction({
        type: "change",
        titulo: resultado.titulo,
        data: resultado.data,
        registro: resultado.registro
      });

      ativarRoletaPorDoacao(nick, valor, tipoDoacao);

      renderHistory();
      renderRanking();
      atualizarPreview();
      renderRoletaAtiva();
      atualizarMiniPlayer();

      if (config.limparValorAposAplicar) valorEl.value = "";
      if (!config.manterNickPreenchido) nickEl.value = "";

      return;
    }

    const variacao = calcularVariacao(valor, tipoDoacao);
    if (!Number.isFinite(variacao) || variacao <= 0) {
      alert("Esse valor não gera alteração com a regra atual.");
      return;
    }

    const sensiAntesDaMudanca = Number(sensi.toFixed(3));
    let novaSensi = sensiAntesDaMudanca;

    if (direcao === "up") novaSensi += variacao;
    else novaSensi -= variacao;

    if (novaSensi > config.sensiMax) novaSensi = config.sensiMax;
    if (novaSensi < config.sensiMin) novaSensi = config.sensiMin;

    atualizarCardsSensi(novaSensi, sensiAntesDaMudanca);

    const mensagem = gerarMensagem({
      nick,
      valor,
      tipoDoacao,
      direcao,
      variacao,
      sensiFinal: sensi,
      sensiAntes: sensiAntesDaMudanca
    });

    statusTextEl.textContent = mensagem;

    const resultado = salvarRegistroNoHistorico({
      nick,
      valor,
      tipoDoacao,
      direcao,
      variacao,
      sensiAntes: sensiAntesDaMudanca,
      sensiFinal: sensi,
      origem: "doacao"
    });

    pushUndoAction({
      type: "change",
      titulo: resultado.titulo,
      data: resultado.data,
      registro: resultado.registro
    });

    renderHistory();
    renderRanking();
    atualizarPreview();
    atualizarMiniPlayer();

    if (config.limparValorAposAplicar) valorEl.value = "";
    if (!config.manterNickPreenchido) nickEl.value = "";

    if (config.manterNickPreenchido) valorEl.focus();
    else nickEl.focus();
  }

  function aplicarSensiManual() {
    const titulo = localStorage.getItem("tituloLive");
    if (!titulo) {
      alert("Defina o título da live primeiro.");
      return;
    }

    const valorManual = parseFloat(manualSensiInputEl.value);
    if (!Number.isFinite(valorManual) || valorManual < 0) {
      alert("Digite uma sensi manual válida.");
      return;
    }

    let novaSensi = valorManual;
    if (novaSensi > config.sensiMax) novaSensi = config.sensiMax;
    if (novaSensi < config.sensiMin && novaSensi !== 0) novaSensi = config.sensiMin;

    const antes = Number(sensi.toFixed(3));
    atualizarCardsSensi(novaSensi, antes);

    const direcao = novaSensi >= antes ? "up" : "down";
    const variacao = Math.abs(novaSensi - antes);

    statusTextEl.textContent = `Ajuste manual • sensi ${format3(antes)} → ${format3(novaSensi)}`;

    const resultado = salvarRegistroNoHistorico({
      nick: "Ajuste manual",
      valor: variacao,
      tipoDoacao: "pix",
      direcao,
      variacao,
      sensiAntes: antes,
      sensiFinal: novaSensi,
      origem: "manual"
    });

    pushUndoAction({
      type: "change",
      titulo: resultado.titulo,
      data: resultado.data,
      registro: resultado.registro
    });

    manualSensiInputEl.value = "";
    renderHistory();
    renderRanking();
    atualizarPreview();
    atualizarMiniPlayer();
    showToast("Sensi manual aplicada");
  }

  function desfazerUltimaAcao() {
    const undo = carregarUndoStack();
    if (!undo.length) {
      alert("Não há ação para desfazer.");
      return;
    }

    const acao = undo.pop();
    salvarUndoStack(undo);

    if (acao.type === "change") {
      removerRegistroPorId(acao.registro.id);
      atualizarCardsSensi(acao.registro.sensiAntes, acao.registro.sensiFinal);

      const redo = carregarRedoStack();
      redo.push(acao);
      salvarRedoStack(redo);

      statusTextEl.textContent = `Desfeita a ação de ${acao.registro.nick}.`;
      renderHistory();
      renderRanking();
      atualizarPreview();
      atualizarMiniPlayer();
      showToast("Última ação desfeita");
    }
  }

  function refazerUltimaAcao() {
    const redo = carregarRedoStack();
    if (!redo.length) {
      alert("Não há ação para refazer.");
      return;
    }

    const acao = redo.pop();
    salvarRedoStack(redo);

    if (acao.type === "change") {
      inserirRegistroNoHistoricoExistente(acao.registro, acao.titulo, acao.data);
      atualizarCardsSensi(acao.registro.sensiFinal, acao.registro.sensiAntes);

      const undo = carregarUndoStack();
      undo.push(acao);
      salvarUndoStack(undo);

      statusTextEl.textContent = `Refeita a ação de ${acao.registro.nick}.`;
      renderHistory();
      renderRanking();
      atualizarPreview();
      atualizarMiniPlayer();
      showToast("Última ação refeita");
    }
  }

  function limparCampos() {
    nickEl.value = "";
    valorEl.value = "";
    manualSensiInputEl.value = "";
    tipoEl.value = "pix";
    atualizarPreview();
    nickEl.focus();
    showToast("Campos limpos");
  }

  function getPreviewInfo() {
    const valor = parseFloat(valorEl.value);
    const tipoDoacao = tipoEl.value;
    const nick = nickEl.value.trim() || "Anônimo";

    if (!Number.isFinite(valor) || valor <= 0) {
      return { valido: false, texto: "Aguardando doação..." };
    }

    if (doacaoAtivaRoleta(valor, tipoDoacao)) {
      return {
        valido: false,
        texto: `Essa doação ativa a roleta (${tipoDoacao === "bits" ? "bits" : "PIX"}) e vai girar automaticamente.`
      };
    }

    const variacao = calcularVariacao(valor, tipoDoacao);

    if (!Number.isFinite(variacao) || variacao <= 0) {
      return { valido: false, texto: "Esse valor não gera alteração com a regra atual." };
    }

    const subir = Math.min(config.sensiMax, sensi + variacao);
    const descer = Math.max(config.sensiMin, sensi - variacao);

    return { valido: true, nick, valor, tipoDoacao, variacao, subir, descer };
  }

  function atualizarPreview() {
    const info = getPreviewInfo();

    if (!info.valido) {
      previewIdleEl.style.display = "block";
      previewIdleEl.textContent = info.texto || "Aguardando doação...";
      previewLineEl.classList.remove("show");
      previewUpValueEl.textContent = format3(sensi);
      previewDownValueEl.textContent = format3(sensi);
      previewUpSubEl.textContent = "";
      previewDownSubEl.textContent = "";
      return;
    }

    previewIdleEl.style.display = "none";
    previewLineEl.classList.add("show");

    const doacaoTexto = montarDoacaoTexto(info.valor, info.tipoDoacao);

    previewUpValueEl.textContent = format3(info.subir);
    previewDownValueEl.textContent = format3(info.descer);

    previewUpSubEl.textContent = `${info.nick} • ${doacaoTexto} • +${format3(info.variacao)}`;
    previewDownSubEl.textContent = `${info.nick} • ${doacaoTexto} • -${format3(info.variacao)}`;
  }

  function renderPresetOptions() {
    const select = document.getElementById("presetSelect");
    const presets = carregarPresets();

    select.innerHTML =
      '<option value="">Selecione um preset</option>' +
      presets.map((preset, index) => `<option value="${index}">${escapeHtml(preset.name)}</option>`).join("");
  }

  function salvarPresetAtual() {
    try {
      const nome = document.getElementById("presetNameInput").value.trim();
      if (!nome) {
        alert("Digite um nome para o preset.");
        return;
      }

      const nova = lerFormularioConfig();
      const presets = carregarPresets();
      const idx = presets.findIndex(p => p.name.toLowerCase() === nome.toLowerCase());

      const preset = { name: nome, config: nova };

      if (idx !== -1) presets[idx] = preset;
      else presets.push(preset);

      salvarPresets(presets);
      renderPresetOptions();
      document.getElementById("presetNameInput").value = "";
      showToast("Preset salvo");
    } catch (erro) {
      alert(erro.message);
    }
  }

  function carregarPresetSelecionado() {
    const index = document.getElementById("presetSelect").value;
    if (index === "") {
      alert("Selecione um preset.");
      return;
    }

    const presets = carregarPresets();
    const preset = presets[Number(index)];
    if (!preset) return;

    config = normalizeConfig(preset.config);
    preencherFormularioConfig();
    showToast("Preset carregado");
  }

  function excluirPresetSelecionado() {
    const index = document.getElementById("presetSelect").value;
    if (index === "") {
      alert("Selecione um preset.");
      return;
    }

    const presets = carregarPresets();
    const preset = presets[Number(index)];
    if (!preset) return;

    const confirmar = confirm(`Excluir o preset "${preset.name}"?`);
    if (!confirmar) return;

    presets.splice(Number(index), 1);
    salvarPresets(presets);
    renderPresetOptions();
    showToast("Preset excluído");
  }

  function baixarArquivo(nome, conteudo, tipoMime) {
    const blob = new Blob([conteudo], { type: tipoMime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportarConfig() {
    baixarArquivo("config-sensi.json", JSON.stringify(config, null, 2), "application/json;charset=utf-8;");
    showToast("Config exportada");
  }

  function montarTextoHistorico(historico) {
    return historico.map(live => {
      const bloco = (live.registros || []).map(r => {
        const doacao = r.origem === "manual"
          ? `🎯 ajuste manual`
          : r.origem === "roulette_trigger"
            ? `🎲 ativou roleta`
            : (r.tipoDoacao === "bits"
              ? `💎 ${r.valor} bits`
              : `💰 R$${Number(r.valor).toFixed(2).replace(".", ",")}`);
        const variacao = `${r.direcao === "up" ? "+" : "-"}${Number(r.variacao).toFixed(3)}`;
        return `• ${r.nick} | ${doacao} | ${variacao} | sensi ${Number(r.sensiFinal).toFixed(3)}`;
      }).join("\n");

      return `${live.titulo} - ${live.data}\n${bloco}`;
    }).join("\n\n");
  }

  function exportarTxt() {
    const historico = carregarHistorico();
    if (!historico.length) {
      alert("Não há histórico para exportar.");
      return;
    }
    baixarArquivo("historico-sensi.txt", montarTextoHistorico(historico), "text/plain;charset=utf-8;");
    showToast("TXT exportado");
  }

  function exportarCsv() {
    const historico = carregarHistorico();
    if (!historico.length) {
      alert("Não há histórico para exportar.");
      return;
    }

    const linhas = [
      ["live","data","nick","tipo","valor","direcao","variacao","sensi_antes","sensi_final","data_hora","origem"].join(";")
    ];

    historico.forEach(live => {
      (live.registros || []).forEach(r => {
        linhas.push([
          `"${String(live.titulo).replaceAll('"','""')}"`,
          `"${live.data}"`,
          `"${String(r.nick).replaceAll('"','""')}"`,
          `"${r.tipoDoacao}"`,
          `"${r.valor}"`,
          `"${r.direcao}"`,
          `"${r.variacao}"`,
          `"${r.sensiAntes}"`,
          `"${r.sensiFinal}"`,
          `"${r.dataHora}"`,
          `"${r.origem || "doacao"}"`
        ].join(";"));
      });
    });

    baixarArquivo("historico-sensi.csv", linhas.join("\n"), "text/csv;charset=utf-8;");
    showToast("CSV exportado");
  }

  function renderHistory() {
    const historico = carregarHistorico();
    const busca = (document.getElementById("historySearchInput")?.value || "").trim().toLowerCase();
    const tipoFiltro = document.getElementById("historyTipoFilter")?.value || "all";
    const dataFiltroIso = document.getElementById("historyDateFilter")?.value || "";
    const dataFiltroPtBr = dataFiltroIso ? dataFiltroIso.split("-").reverse().join("/") : "";

    const filtrado = historico.map(live => {
      const registros = (live.registros || []).filter(registro => {
        const okBusca = !busca || String(registro.nick || "").toLowerCase().includes(busca);
        const okTipo = tipoFiltro === "all" || registro.tipoDoacao === tipoFiltro;
        const okData = !dataFiltroPtBr || live.data === dataFiltroPtBr;
        return okBusca && okTipo && okData;
      });
      return { ...live, registros };
    }).filter(live => live.registros.length > 0);

    if (!filtrado.length) {
      historyListEl.innerHTML = '<div class="history-empty">Nenhum registro encontrado com os filtros atuais.</div>';
      return;
    }

    historyListEl.innerHTML = filtrado.map((live, liveIndex) => {
      const selectedCount = (live.registros || []).filter(r => historySelection.has(String(r.id))).length;

      const recordsHtml = (live.registros || []).map((registro) => {
        const doacao = registro.origem === "manual"
          ? `🎯 Ajuste manual`
          : registro.origem === "roulette_trigger"
            ? `🎲 Roleta ativada`
            : (registro.tipoDoacao === "bits"
              ? `💎 ${registro.valor} bits`
              : `💰 R$${Number(registro.valor).toFixed(2).replace(".", ",")}`);

        const variacao = `${registro.direcao === "up" ? "🟢 +" : "🔴 -"}${Number(registro.variacao).toFixed(3)}`;
        const checked = historySelection.has(String(registro.id)) ? "checked" : "";

        return `
          <div class="record">
            <div class="record-top">
              <label class="record-check">
                <input type="checkbox" ${checked} onchange="toggleRegistroSelecionado(${registro.id}, this.checked)" />
                <span>Selecionar</span>
              </label>
            </div>

            <div class="record-grid">
              <div class="item">
                <div class="item-label">Pessoa</div>
                <div class="item-value">👤 ${escapeHtml(registro.nick)}</div>
              </div>

              <div class="item">
                <div class="item-label">Doação</div>
                <div class="item-value">${doacao}</div>
              </div>

              <div class="item">
                <div class="item-label">Mudança</div>
                <div class="item-value">${variacao}</div>
              </div>

              <div class="item">
                <div class="item-label">Sensi atual</div>
                <div class="item-value">🎯 ${Number(registro.sensiFinal).toFixed(3)}</div>
              </div>
            </div>

            <div class="record-footer">
              <div class="time">${escapeHtml(registro.dataHora || "")}</div>

              <div class="record-actions">
                <button class="mini-btn copy-live-btn" type="button" onclick="copiarRegistroPorId(${registro.id})">📋 Copiar</button>
                <button class="mini-btn use-btn" type="button" onclick="usarRegistroPorId(${registro.id})">↩ Usar</button>
                <button class="mini-btn delete-btn" type="button" onclick="excluirRegistroPorId(${registro.id})">🗑️ Excluir</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="live-card" data-live-index="${liveIndex}">
          <button class="live-header" type="button" onclick="toggleLive(${liveIndex})">
            <div class="live-left">
              <div class="arrow">▶️</div>
              <div class="live-title-group">
                <div class="live-name">${escapeHtml(live.titulo)}</div>
                <div class="live-date">${escapeHtml(live.data)}</div>
              </div>
            </div>

            <div class="live-count">${(live.registros || []).length} registro(s)</div>
          </button>

          <div class="live-content">
            <div class="history-live-tools">
              <button class="history-live-tool-btn copy" type="button" onclick="copiarTextoLivePorId(${live.id})">📋 Copiar live</button>
              <button class="history-live-tool-btn select" type="button" onclick="selecionarTodosDaLive(${live.id})">☑️ Marcar todos</button>
              <button class="history-live-tool-btn clear" type="button" onclick="limparSelecaoDaLive(${live.id})">🧹 Limpar seleção</button>
              <button class="history-live-tool-btn delete" type="button" onclick="excluirSelecionadosDaLive(${live.id})">🗑️ Excluir selecionados (${selectedCount})</button>
              <button class="history-live-tool-btn delete" type="button" onclick="excluirLivePorId(${live.id})">🗑️ Apagar live inteira</button>
            </div>

            ${recordsHtml || '<div class="history-empty">Nenhum registro nesta live.</div>'}
          </div>
        </div>
      `;
    }).join("");
  }

  function somarPorNick(live, filtroFn, transformFn) {
    const mapa = {};
    (live?.registros || []).forEach(r => {
      if (!filtroFn(r)) return;
      const nick = r.nick || "Anônimo";
      mapa[nick] = (mapa[nick] || 0) + transformFn(r);
    });

    return Object.entries(mapa)
      .map(([nick, valor]) => ({ nick, valor }))
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 5);
  }

  function montarRankingCard(titulo, lista, formatador) {
    if (!lista.length) {
      return `
        <div class="ranking-card">
          <div class="ranking-title">${titulo}</div>
          <div class="history-empty">Sem dados nesta categoria.</div>
        </div>
      `;
    }

    return `
      <div class="ranking-card">
        <div class="ranking-title">${titulo}</div>
        <div class="ranking-list">
          ${lista.map((item, index) => `
            <div class="ranking-item">
              <div class="ranking-pos">#${index + 1}</div>
              <div class="ranking-name">${escapeHtml(item.nick)}</div>
              <div class="ranking-value">${formatador(item.valor)}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderRanking() {
    const historico = carregarHistorico();
    const live = findCurrentLive(historico);

    if (!live || !(live.registros || []).length) {
      rankingContentEl.innerHTML = '<div class="history-empty">Nenhum ranking disponível ainda.</div>';
      return;
    }

    const rankUp = somarPorNick(
      live,
      r => r.direcao === "up" && r.origem !== "roulette_trigger",
      r => Number(r.variacao || 0)
    );

    const rankDown = somarPorNick(
      live,
      r => r.direcao === "down" && r.origem !== "roulette_trigger",
      r => Number(r.variacao || 0)
    );

    const rankBits = somarPorNick(
      live,
      r => r.tipoDoacao === "bits" && r.origem === "doacao",
      r => Number(r.valor || 0)
    );

    const rankPix = somarPorNick(
      live,
      r => r.tipoDoacao === "pix" && r.origem === "doacao",
      r => Number(r.valor || 0)
    );

    rankingContentEl.innerHTML = [
      montarRankingCard("⬆️ Quem mais subiu a sensi", rankUp, v => `+${format3(v)}`),
      montarRankingCard("⬇️ Quem mais desceu a sensi", rankDown, v => `-${format3(v)}`),
      montarRankingCard("💎 Quem mais doou bits", rankBits, v => `${Number(v)} bits`),
      montarRankingCard("💰 Quem mais doou PIX", rankPix, v => `R$${formatMoney(v)}`)
    ].join("");
  }

  function encontrarRegistroPorId(idRegistro) {
    const historico = carregarHistorico();
    for (const live of historico) {
      const registro = (live.registros || []).find(r => r.id === idRegistro);
      if (registro) return { live, registro };
    }
    return null;
  }

  function encontrarLivePorId(liveId) {
    const historico = carregarHistorico();
    return historico.find(l => l.id === liveId) || null;
  }

  function usarRegistroPorId(idRegistro) {
    const found = encontrarRegistroPorId(idRegistro);
    if (!found) return;

    const { registro, live } = found;

    if (live?.titulo) localStorage.setItem("tituloLive", live.titulo);

    nickEl.value = registro.nick === "Ajuste manual" ? "" : (registro.nick || "");
    valorEl.value = registro.origem === "manual" || registro.origem === "roulette_trigger" ? "" : registro.valor;
    tipoEl.value = registro.tipoDoacao || "pix";
    manualSensiInputEl.value = registro.sensiFinal;

    atualizarCardsSensi(Number(registro.sensiFinal), Number(registro.sensiAntes));
    renderTituloLive();
    atualizarPreview();
    fecharHistorico();

    statusTextEl.textContent = `Registro carregado: ${registro.nick} • sensi ${format3(registro.sensiFinal)}`;
    atualizarMiniPlayer();
    showToast("Registro carregado");
  }

  function toggleLive(index) {
    const card = document.querySelector(`[data-live-index="${index}"]`);
    if (card) card.classList.toggle("open");
  }

  function copiarTexto(texto, mensagem = "Copiado") {
    navigator.clipboard.writeText(texto)
      .then(() => showToast(mensagem))
      .catch(() => alert("Não foi possível copiar."));
  }

  function copiarUltimaAcao() {
    const texto = statusTextEl.textContent.trim();
    if (!texto || texto === "Nenhuma alteração aplicada ainda.") {
      alert("Não há última ação para copiar.");
      return;
    }
    copiarTexto(texto, "Última ação copiada");
  }

  function copiarPreview() {
    if (previewLineEl.classList.contains("show")) {
      const texto = `⬆️ Se subir: ${previewUpValueEl.textContent} | ⬇️ Se descer: ${previewDownValueEl.textContent}`;
      copiarTexto(texto, "Prévia copiada");
      return;
    }

    copiarTexto(previewIdleEl.textContent.trim(), "Prévia copiada");
  }

  function copiarRegistroPorId(idRegistro) {
    const found = encontrarRegistroPorId(idRegistro);
    if (!found) return;

    const { registro } = found;

    const texto = registro.origem === "manual"
      ? `Ajuste manual • sensi atual ${Number(registro.sensiFinal).toFixed(3)}`
      : registro.origem === "roulette_trigger"
        ? `${registro.nick} ativou a roleta`
        : gerarMensagem({
            nick: registro.nick,
            valor: registro.valor,
            tipoDoacao: registro.tipoDoacao,
            direcao: registro.direcao,
            variacao: Number(registro.variacao),
            sensiFinal: Number(registro.sensiFinal),
            sensiAntes: Number(registro.sensiAntes)
          });

    copiarTexto(texto, "Registro copiado");
  }

  function copiarTextoLivePorId(liveId) {
    const live = encontrarLivePorId(liveId);
    if (!live) return;
    copiarTexto(montarTextoHistorico([live]), "Live copiada");
  }

  function copiarTudo() {
    const historico = carregarHistorico();
    if (!historico.length) {
      alert("Não há histórico para copiar.");
      return;
    }
    copiarTexto(montarTextoHistorico(historico), "Histórico copiado");
  }

  function copiarLiveAtual() {
    const historico = carregarHistorico();
    const live = findCurrentLive(historico);

    if (!live || !(live.registros || []).length) {
      alert("Não há registros da live atual para copiar.");
      return;
    }

    copiarTexto(montarTextoHistorico([live]), "Live atual copiada");
  }

  function copiarRanking() {
    const historico = carregarHistorico();
    const live = findCurrentLive(historico);

    if (!live || !(live.registros || []).length) {
      alert("Não há ranking para copiar.");
      return;
    }

    const rankUp = somarPorNick(live, r => r.direcao === "up" && r.origem !== "roulette_trigger", r => Number(r.variacao || 0));
    const rankDown = somarPorNick(live, r => r.direcao === "down" && r.origem !== "roulette_trigger", r => Number(r.variacao || 0));
    const rankBits = somarPorNick(live, r => r.tipoDoacao === "bits" && r.origem === "doacao", r => Number(r.valor || 0));
    const rankPix = somarPorNick(live, r => r.tipoDoacao === "pix" && r.origem === "doacao", r => Number(r.valor || 0));

    const toText = (titulo, lista, formatador) => {
      if (!lista.length) return `${titulo}\nSem dados`;
      return `${titulo}\n` + lista.map((item, i) => `${i + 1}. ${item.nick} - ${formatador(item.valor)}`).join("\n");
    };

    const texto = [
      toText("Quem mais subiu", rankUp, v => `+${format3(v)}`),
      toText("Quem mais desceu", rankDown, v => `-${format3(v)}`),
      toText("Quem mais doou bits", rankBits, v => `${Number(v)} bits`),
      toText("Quem mais doou PIX", rankPix, v => `R$${formatMoney(v)}`)
    ].join("\n\n");

    copiarTexto(texto, "Ranking copiado");
  }

  function toggleRegistroSelecionado(idRegistro, checked) {
    if (checked) historySelection.add(String(idRegistro));
    else historySelection.delete(String(idRegistro));
    renderHistory();
  }

  function selecionarTodosDaLive(liveId) {
    const live = encontrarLivePorId(liveId);
    if (!live) return;
    (live.registros || []).forEach(r => historySelection.add(String(r.id)));
    renderHistory();
    showToast("Todos marcados");
  }

  function limparSelecaoDaLive(liveId) {
    const live = encontrarLivePorId(liveId);
    if (!live) return;
    (live.registros || []).forEach(r => historySelection.delete(String(r.id)));
    renderHistory();
    showToast("Seleção limpa");
  }

  function excluirSelecionadosDaLive(liveId) {
    const live = encontrarLivePorId(liveId);
    if (!live) return;

    const selecionados = (live.registros || []).filter(r => historySelection.has(String(r.id)));
    if (!selecionados.length) {
      alert("Nenhum registro selecionado nessa live.");
      return;
    }

    const confirmar = confirm(`Excluir ${selecionados.length} registro(s) dessa live?`);
    if (!confirmar) return;

    const removidos = removerRegistrosSelecionadosDaLive(liveId);
    selecionados.forEach(r => historySelection.delete(String(r.id)));
    renderHistory();
    renderRanking();
    showToast(`${removidos} registro(s) excluído(s)`);
  }

  function excluirLivePorId(liveId) {
    const live = encontrarLivePorId(liveId);
    if (!live) return;

    const confirmar = confirm(`Apagar toda a live "${live.titulo}" de ${live.data}?`);
    if (!confirmar) return;

    removerLivePorId(liveId);
    renderHistory();
    renderRanking();
    showToast("Live apagada");
  }

  function excluirRegistroPorId(idRegistro) {
    const found = encontrarRegistroPorId(idRegistro);
    if (!found) return;

    const { registro } = found;
    const confirmar = confirm(`Excluir o registro de ${registro.nick}?`);
    if (!confirmar) return;

    removerRegistroPorId(idRegistro);
    renderHistory();
    renderRanking();
    showToast("Registro excluído");
  }

  function limparTudo() {
    const historico = carregarHistorico();
    if (!historico.length) {
      alert("Não há histórico para apagar.");
      return;
    }

    const confirmar = confirm("Apagar todo o histórico?");
    if (!confirmar) return;

    historySelection.clear();
    localStorage.removeItem("historico");
    renderHistory();
    renderRanking();
    atualizarResumoLiveAtual();
    showToast("Histórico apagado");
  }

  function limparFiltrosHistorico() {
    document.getElementById("historySearchInput").value = "";
    document.getElementById("historyTipoFilter").value = "all";
    document.getElementById("historyDateFilter").value = "";
    renderHistory();
    showToast("Filtros limpos");
  }

  function ativarMiniPlayer() {
    miniPlayerEl.classList.add("show");
    localStorage.setItem("miniPlayerEnabledSensi", "1");
    restaurarPosicaoMiniPlayer();
    atualizarMiniPlayer();
    showToast("Mini-Player ativado");
  }

  function desativarMiniPlayer() {
    miniPlayerEl.classList.remove("show");
    localStorage.setItem("miniPlayerEnabledSensi", "0");
    showToast("Mini-Player fechado");
  }

  function alternarMiniPlayer() {
    if (miniPlayerEl.classList.contains("show")) desativarMiniPlayer();
    else ativarMiniPlayer();
  }

  function aplicarEstadoMiniPlayerInicial() {
    const enabled = localStorage.getItem("miniPlayerEnabledSensi") === "1";
    if (enabled) {
      miniPlayerEl.classList.add("show");
      restaurarPosicaoMiniPlayer();
    }
    atualizarMiniPlayer();
  }

  function salvarPosicaoMiniPlayer(left, top) {
    localStorage.setItem("miniPlayerPositionSensi", JSON.stringify({ left, top }));
  }

  function restaurarPosicaoMiniPlayer() {
    const pos = JSON.parse(localStorage.getItem("miniPlayerPositionSensi") || "null");

    miniPlayerEl.style.right = "auto";
    miniPlayerEl.style.bottom = "auto";

    if (!pos || !Number.isFinite(pos.left) || !Number.isFinite(pos.top)) {
      miniPlayerEl.style.left = `${window.innerWidth - Math.min(320, window.innerWidth - 24) - 18}px`;
      miniPlayerEl.style.top = `${window.innerHeight - miniPlayerEl.offsetHeight - 18}px`;
      return;
    }

    const maxLeft = Math.max(8, window.innerWidth - miniPlayerEl.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - miniPlayerEl.offsetHeight - 8);

    const left = Math.min(Math.max(8, pos.left), maxLeft);
    const top = Math.min(Math.max(8, pos.top), maxTop);

    miniPlayerEl.style.left = `${left}px`;
    miniPlayerEl.style.top = `${top}px`;
  }

  function habilitarDragMiniPlayer() {
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    miniPlayerHeadEl.addEventListener("mousedown", (event) => {
      if (!miniPlayerEl.classList.contains("show")) return;
      if (event.target.closest("button")) return;

      const rect = miniPlayerEl.getBoundingClientRect();
      dragging = true;
      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;
      miniPlayerEl.classList.add("dragging");
      event.preventDefault();
    });

    document.addEventListener("mousemove", (event) => {
      if (!dragging) return;

      const left = Math.min(
        Math.max(8, event.clientX - offsetX),
        window.innerWidth - miniPlayerEl.offsetWidth - 8
      );

      const top = Math.min(
        Math.max(8, event.clientY - offsetY),
        window.innerHeight - miniPlayerEl.offsetHeight - 8
      );

      miniPlayerEl.style.right = "auto";
      miniPlayerEl.style.bottom = "auto";
      miniPlayerEl.style.left = `${left}px`;
      miniPlayerEl.style.top = `${top}px`;
    });

    document.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      miniPlayerEl.classList.remove("dragging");

      const rect = miniPlayerEl.getBoundingClientRect();
      salvarPosicaoMiniPlayer(rect.left, rect.top);
    });

    window.addEventListener("resize", () => {
      if (miniPlayerEl.classList.contains("show")) restaurarPosicaoMiniPlayer();
    });
  }

  document.querySelectorAll(".settings-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll(".settings-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".settings-tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${tab}`).classList.add("active");
    });
  });

  saveLiveBtn.addEventListener("click", salvarTituloLive);
  tituloLiveInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") salvarTituloLive();
  });

  editLiveBtn.addEventListener("click", () => {
    const atual = localStorage.getItem("tituloLive") || "";
    tituloLiveInput.value = atual;
    localStorage.removeItem("tituloLive");
    renderTituloLive();
    tituloLiveInput.focus();
  });

  document.getElementById("btnSubir").addEventListener("click", () => aplicarMudanca("up"));
  document.getElementById("btnDescer").addEventListener("click", () => aplicarMudanca("down"));
  document.getElementById("resetSensiBtn").addEventListener("click", resetarSensi);
  document.getElementById("undoBtn").addEventListener("click", desfazerUltimaAcao);
  document.getElementById("redoBtn").addEventListener("click", refazerUltimaAcao);
  document.getElementById("applyManualBtn").addEventListener("click", aplicarSensiManual);
  document.getElementById("clearFieldsBtn").addEventListener("click", limparCampos);

  document.getElementById("btnHistorico").addEventListener("click", abrirHistorico);
  document.getElementById("openHistoryBtn").addEventListener("click", abrirHistorico);
  document.getElementById("closeHistoryBtn").addEventListener("click", fecharHistorico);
  document.getElementById("closeHistoryX").addEventListener("click", fecharHistorico);

  document.getElementById("openRankingBtn").addEventListener("click", abrirRanking);
  document.getElementById("closeRankingBtn").addEventListener("click", fecharRanking);
  document.getElementById("closeRankingX").addEventListener("click", fecharRanking);
  document.getElementById("copyRankingBtn").addEventListener("click", copiarRanking);

  document.getElementById("toggleMiniPlayerBtn").addEventListener("click", alternarMiniPlayer);
  document.getElementById("closeMiniPlayerBtn").addEventListener("click", desativarMiniPlayer);

  document.getElementById("openSettingsBtn").addEventListener("click", abrirSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click", fecharSettings);
  document.getElementById("closeSettingsX").addEventListener("click", fecharSettings);
  document.getElementById("saveSettingsBtn").addEventListener("click", aplicarNovaConfig);

  document.getElementById("copyLastActionBtn").addEventListener("click", copiarUltimaAcao);
  document.getElementById("copyPreviewBtn").addEventListener("click", copiarPreview);
  document.getElementById("copyAllHistoryBtn").addEventListener("click", copiarTudo);
  document.getElementById("clearHistoryBtn").addEventListener("click", limparTudo);
  document.getElementById("copyCurrentLiveBtn").addEventListener("click", copiarLiveAtual);
  document.getElementById("exportTxtBtn").addEventListener("click", exportarTxt);
  document.getElementById("exportCsvBtn").addEventListener("click", exportarCsv);

  document.getElementById("stopRouletteBtn").addEventListener("click", interromperRoleta);
  document.getElementById("refreshRouletteBtn").addEventListener("click", () => {
    renderRoletaAtiva();
    renderRoulettePanel();
    showToast("Roleta atualizada");
  });

  document.getElementById("historySearchInput").addEventListener("input", renderHistory);
  document.getElementById("historyTipoFilter").addEventListener("change", renderHistory);
  document.getElementById("historyDateFilter").addEventListener("change", renderHistory);
  document.getElementById("clearHistoryFiltersBtn").addEventListener("click", limparFiltrosHistorico);

  document.getElementById("savePresetBtn").addEventListener("click", salvarPresetAtual);
  document.getElementById("loadPresetBtn").addEventListener("click", carregarPresetSelecionado);
  document.getElementById("deletePresetBtn").addEventListener("click", excluirPresetSelecionado);
  document.getElementById("exportConfigBtn").addEventListener("click", exportarConfig);

  valorEl.addEventListener("input", atualizarPreview);
  tipoEl.addEventListener("change", atualizarPreview);
  nickEl.addEventListener("input", atualizarPreview);

  overlayEl.addEventListener("click", fecharTudo);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") fecharTudo();

    if (event.ctrlKey && event.key.toLowerCase() === "z") {
      event.preventDefault();
      desfazerUltimaAcao();
    }

    if (event.ctrlKey && event.key.toLowerCase() === "y") {
      event.preventDefault();
      refazerUltimaAcao();
    }

    if (event.altKey && event.key === "ArrowUp") {
      event.preventDefault();
      aplicarMudanca("up");
    }

    if (event.altKey && event.key === "ArrowDown") {
      event.preventDefault();
      aplicarMudanca("down");
    }
  });

  setInterval(() => {
    renderRoletaAtiva();
    atualizarPreview();
  }, 1000);

  window.toggleLive = toggleLive;
  window.copiarRegistroPorId = copiarRegistroPorId;
  window.usarRegistroPorId = usarRegistroPorId;
  window.excluirRegistroPorId = excluirRegistroPorId;
  window.toggleRegistroSelecionado = toggleRegistroSelecionado;
  window.selecionarTodosDaLive = selecionarTodosDaLive;
  window.limparSelecaoDaLive = limparSelecaoDaLive;
  window.excluirSelecionadosDaLive = excluirSelecionadosDaLive;
  window.excluirLivePorId = excluirLivePorId;
  window.copiarTextoLivePorId = copiarTextoLivePorId;

  renderSensi();
  renderRegras();
  renderTituloLive();
  renderHistory();
  renderRanking();
  renderPresetOptions();
  atualizarPreview();
  renderRoletaAtiva();
  renderRoulettePanel();
  aplicarEstadoMiniPlayerInicial();
  habilitarDragMiniPlayer();
</script>
