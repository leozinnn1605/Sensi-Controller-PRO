<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Sensi</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-1: #090914;
    --bg-2: #12152a;
    --card: rgba(21, 24, 46, 0.9);
    --card-2: rgba(255,255,255,0.04);
    --border: rgba(168, 85, 247, 0.25);
    --border-soft: rgba(255,255,255,0.10);
    --text: #f4f7ff;
    --muted: #aab0d3;
    --purple: #8b5cf6;
    --purple-2: #c084fc;
    --green: #22c55e;
    --green-2: #4ade80;
    --red: #ef4444;
    --red-2: #fb7185;
    --cyan: #38bdf8;
    --shadow: 0 24px 64px rgba(0,0,0,0.42);
    --radius: 26px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at top, rgba(139, 92, 246, 0.24), transparent 34%),
      radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.12), transparent 28%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 24px;
  }

  .panel {
    width: min(100%, 560px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    padding: 1px;
    background: linear-gradient(135deg, rgba(192,132,252,0.38), rgba(56,189,248,0.16), rgba(239,68,68,0.16));
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .title-wrap {
    flex: 1;
    min-width: 0;
  }

  .title-line {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 {
    margin: 0;
    font-size: 2rem;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -0.03em;
  }

  .live-title-line {
    margin-top: 10px;
    min-height: 26px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .live-title-display {
    color: var(--purple-2);
    font-weight: 800;
    text-shadow: 0 0 14px rgba(192,132,252,0.18);
    word-break: break-word;
  }

  .small-btn {
    border: 1px solid var(--border-soft);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 700;
    transition: 0.16s ease;
  }

  .small-btn:hover {
    color: var(--text);
    border-color: var(--purple);
  }

  .icon-btn {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.16s ease;
  }

  .icon-btn:hover {
    transform: translateY(-1px);
  }

  .history-btn {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 12px 28px rgba(99, 102, 241, 0.28);
  }

  .gear-btn {
    background: linear-gradient(135deg, #6d28d9, #9333ea);
    box-shadow: 0 12px 28px rgba(139, 92, 246, 0.28);
  }

  .live-setup {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .live-setup.hidden { display: none; }

  .input, .select {
    width: 100%;
    height: 52px;
    border-radius: 15px;
    border: 1px solid var(--border-soft);
    background: rgba(8, 10, 20, 0.58);
    color: var(--text);
    outline: none;
    padding: 0 14px;
    font-size: 1rem;
    transition: 0.16s ease;
  }

  .input::placeholder {
    color: #8c93bc;
  }

  .input:focus, .select:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 4px rgba(139,92,246,0.14);
  }

  .live-save-btn {
    min-width: 110px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--purple), var(--purple-2));
    color: white;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(139,92,246,0.26);
  }

  .grid {
    display: grid;
    gap: 12px;
  }

  .two {
    grid-template-columns: 1fr 1fr;
  }

  .single {
    grid-template-columns: 1fr;
  }

  .sensi-card {
    margin: 18px 0 16px;
    background: linear-gradient(135deg, rgba(13,16,32,0.78), rgba(30,27,75,0.86));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 18px;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .metric {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 14px;
  }

  .metric-label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .metric-value {
    font-size: 2rem;
    font-weight: 900;
    line-height: 1;
  }

  .metric-current .metric-value {
    color: #7dd3fc;
    text-shadow: 0 0 18px rgba(56,189,248,0.22);
  }

  .metric-prev .metric-value {
    color: #f9a8d4;
    text-shadow: 0 0 18px rgba(244,114,182,0.14);
  }

  .rules-line {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }

  .pill {
    font-size: 0.8rem;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.03);
    padding: 7px 10px;
    border-radius: 999px;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }

  .btn {
    height: 54px;
    border: none;
    border-radius: 18px;
    color: white;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    transition: 0.16s ease;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn-up {
    background: linear-gradient(135deg, var(--green), var(--green-2));
    box-shadow: 0 16px 30px rgba(34,197,94,0.24);
  }

  .btn-down {
    background: linear-gradient(135deg, var(--red), var(--red-2));
    box-shadow: 0 16px 30px rgba(239,68,68,0.24);
  }

  .footer-buttons {
    display: grid;
    gap: 12px;
    margin-top: 14px;
  }

  .btn-secondary {
    background: linear-gradient(135deg, #6d28d9, #9333ea);
    box-shadow: 0 16px 30px rgba(139,92,246,0.22);
  }

  .status-box {
    margin-top: 16px;
    min-height: 90px;
    border-radius: 18px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
  }

  .status-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .status-label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .status-tools {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .tiny-btn {
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 10px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 800;
  }

  .tiny-btn:hover {
    border-color: var(--purple);
  }

  .status-text {
    color: #eef2ff;
    line-height: 1.45;
    font-size: 0.98rem;
    word-break: break-word;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 15, 0.52);
    opacity: 0;
    pointer-events: none;
    transition: 0.2s ease;
    z-index: 15;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: 0;
    width: min(100%, 420px);
    height: 100vh;
    background: rgba(14, 17, 34, 0.96);
    box-shadow: 0 0 60px rgba(0,0,0,0.34);
    transition: 0.22s ease;
    z-index: 20;
    display: flex;
    flex-direction: column;
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .drawer-header h2 {
    margin: 0;
    font-size: 1.35rem;
  }

  .drawer-content {
    padding: 18px 20px 24px;
    overflow: auto;
    flex: 1;
  }

  .drawer-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 20px 22px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .history-panel {
    left: 0;
    border-right: 1px solid rgba(255,255,255,0.08);
    transform: translateX(-100%);
  }

  .history-panel.show {
    transform: translateX(0);
  }

  .settings-panel {
    right: 0;
    border-left: 1px solid rgba(255,255,255,0.08);
    transform: translateX(100%);
  }

  .settings-panel.show {
    transform: translateX(0);
  }

  .config-section {
    margin-bottom: 18px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 14px;
  }

  .config-section h3 {
    margin: 0 0 12px;
    font-size: 0.96rem;
    color: var(--purple-2);
  }

  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .config-field label {
    display: block;
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 7px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .checkbox-row:first-of-type {
    border-top: none;
  }

  .checkbox-row span {
    color: var(--text);
    font-size: 0.95rem;
  }

  .btn-save {
    background: linear-gradient(135deg, #16a34a, #22c55e);
  }

  .btn-close {
    background: linear-gradient(135deg, #6b7280, #4b5563);
  }

  .history-tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .history-tool-btn {
    border: none;
    border-radius: 14px;
    min-height: 48px;
    padding: 10px 12px;
    color: white;
    font-weight: 800;
    cursor: pointer;
  }

  .copy-btn { background: linear-gradient(135deg, #4f46e5, #8b5cf6); }
  .clear-btn { background: linear-gradient(135deg, #dc2626, #ef4444); }

  .history-empty {
    text-align: center;
    color: var(--muted);
    padding: 34px 20px;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 18px;
    background: rgba(255,255,255,0.02);
  }

  .live-card {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .live-header {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(192,132,252,0.06));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px;
    cursor: pointer;
    text-align: left;
  }

  .live-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .arrow {
    transition: transform 0.2s ease;
  }

  .live-card.open .arrow {
    transform: rotate(90deg);
  }

  .live-title-group {
    min-width: 0;
  }

  .live-name {
    font-size: 1rem;
    font-weight: 800;
    word-break: break-word;
  }

  .live-date {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.84rem;
  }

  .live-count {
    color: var(--purple-2);
    font-size: 0.84rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .live-content {
    display: none;
    padding: 14px;
  }

  .live-card.open .live-content {
    display: block;
  }

  .record {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .record-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .item {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 10px;
  }

  .item-label {
    color: var(--muted);
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .item-value {
    font-size: 0.95rem;
    font-weight: 800;
    line-height: 1.3;
    word-break: break-word;
  }

  .record-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .time {
    color: var(--muted);
    font-size: 0.82rem;
  }

  .record-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mini-btn {
    border: none;
    border-radius: 10px;
    padding: 9px 12px;
    color: white;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.82rem;
  }

  .copy-live-btn { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
  .delete-btn { background: linear-gradient(135deg, #dc2626, #ef4444); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(14px);
    background: rgba(12, 15, 28, 0.95);
    border: 1px solid rgba(255,255,255,0.10);
    color: white;
    padding: 12px 16px;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.18s ease;
    z-index: 50;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    font-weight: 700;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 620px) {
    .panel { padding: 20px; }
    .two, .metrics, .buttons, .live-setup, .drawer-footer, .config-grid, .history-tools, .record-grid {
      grid-template-columns: 1fr;
      display: grid;
    }
    .live-save-btn { height: 52px; }
    .icon-btn { width: 42px; height: 42px; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="top-row">
      <div class="title-wrap">
        <div class="title-line">
          <div style="font-size:1.8rem;">🎮</div>
          <h1>Painel de Sensi</h1>
        </div>

        <div class="live-title-line">
          <div id="liveTitleDisplay" class="live-title-display"></div>
          <button id="editLiveBtn" class="small-btn" type="button" style="display:none;">Editar título</button>
        </div>
      </div>

      <div class="title-actions">
        <button id="openHistoryBtn" class="icon-btn history-btn" type="button" title="Histórico">📜</button>
        <button id="openSettingsBtn" class="icon-btn gear-btn" type="button" title="Configurações">⚙️</button>
      </div>
    </div>

    <div id="liveSetup" class="live-setup">
      <input id="tituloLiveInput" class="input" type="text" placeholder="Título da live" maxlength="120" />
      <button id="saveLiveBtn" class="live-save-btn" type="button">OK</button>
    </div>

    <div class="grid single">
      <input id="nick" class="input" type="text" placeholder="Nick de quem doou" maxlength="60" />
    </div>

    <div class="grid two" style="margin-top:12px;">
      <select id="tipo" class="select">
        <option value="pix">PIX (R$)</option>
        <option value="bits">Bits</option>
      </select>

      <input id="valor" class="input" type="number" min="0" step="0.01" placeholder="Valor" />
    </div>

    <div class="sensi-card">
      <div class="metrics">
        <div class="metric metric-current">
          <div class="metric-label">Sensi atual</div>
          <div id="atual" class="metric-value">0.080</div>
        </div>

        <div class="metric metric-prev">
          <div class="metric-label">Anterior</div>
          <div id="anterior" class="metric-value">0.080</div>
        </div>
      </div>

      <div id="rulesLine" class="rules-line"></div>

      <div class="pill-row">
        <div id="pillPix" class="pill"></div>
        <div id="pillBits" class="pill"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="btnSubir" class="btn btn-up" type="button">⬆️ Subir</button>
      <button id="btnDescer" class="btn btn-down" type="button">⬇️ Descer</button>
    </div>

    <div class="footer-buttons">
      <button id="btnHistorico" class="btn btn-secondary" type="button">📜 Ver Histórico</button>
    </div>

    <div class="status-box">
      <div class="status-head">
        <div class="status-label">Última ação</div>
        <div class="status-tools">
          <button id="copyLastActionBtn" class="tiny-btn" type="button">📋 Copiar</button>
        </div>
      </div>
      <div id="statusText" class="status-text">Nenhuma alteração aplicada ainda.</div>
    </div>
  </div>

  <div id="overlay" class="overlay"></div>

  <aside id="historyPanel" class="drawer history-panel" aria-hidden="true">
    <div class="drawer-header">
      <h2>Histórico</h2>
      <button id="closeHistoryX" class="small-btn" type="button">Fechar</button>
    </div>

    <div class="drawer-content">
      <div class="history-tools">
        <button id="copyAllHistoryBtn" class="history-tool-btn copy-btn" type="button">📋 Copiar tudo</button>
        <button id="clearHistoryBtn" class="history-tool-btn clear-btn" type="button">🗑️ Limpar tudo</button>
      </div>

      <div id="historyList"></div>
    </div>

    <div class="drawer-footer">
      <button id="closeHistoryBtn" class="btn btn-close" type="button">Fechar</button>
      <button id="copyCurrentLiveBtn" class="btn btn-save" type="button">Copiar live atual</button>
    </div>
  </aside>

  <aside id="settingsPanel" class="drawer settings-panel" aria-hidden="true">
    <div class="drawer-header">
      <h2>Configurações</h2>
      <button id="closeSettingsX" class="small-btn" type="button">Fechar</button>
    </div>

    <div class="drawer-content">
      <div class="config-section">
        <h3>Regras de cálculo</h3>
        <div class="config-grid">
          <div class="config-field">
            <label for="cfgReaisPorUnidade">R$ por unidade</label>
            <input id="cfgReaisPorUnidade" class="input" type="number" min="0.01" step="0.01" />
          </div>

          <div class="config-field">
            <label for="cfgBitsPorUnidade">Bits por unidade</label>
            <input id="cfgBitsPorUnidade" class="input" type="number" min="1" step="1" />
          </div>

          <div class="config-field">
            <label for="cfgVariacaoPorUnidade">Variação da sensi</label>
            <input id="cfgVariacaoPorUnidade" class="input" type="number" min="0.001" step="0.001" />
          </div>

          <div class="config-field">
            <label for="cfgSensiInicial">Sensi inicial padrão</label>
            <input id="cfgSensiInicial" class="input" type="number" min="0.001" step="0.001" />
          </div>
        </div>
      </div>

      <div class="config-section">
        <h3>Limites</h3>
        <div class="config-grid">
          <div class="config-field">
            <label for="cfgSensiMin">Sensi mínima</label>
            <input id="cfgSensiMin" class="input" type="number" min="0" step="0.001" />
          </div>

          <div class="config-field">
            <label for="cfgSensiMax">Sensi máxima</label>
            <input id="cfgSensiMax" class="input" type="number" min="0" step="0.001" />
          </div>
        </div>
      </div>

      <div class="config-section">
        <h3>Comportamento</h3>

        <label class="checkbox-row">
          <span>Usar valores proporcionais</span>
          <input id="cfgPermitirFracionado" type="checkbox" />
        </label>

        <label class="checkbox-row">
          <span>Limpar valor após aplicar</span>
          <input id="cfgLimparValor" type="checkbox" />
        </label>

        <label class="checkbox-row">
          <span>Manter nick preenchido</span>
          <input id="cfgManterNick" type="checkbox" />
        </label>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="saveSettingsBtn" class="btn btn-save" type="button">Salvar</button>
      <button id="closeSettingsBtn" class="btn btn-close" type="button">Fechar</button>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

<script>
  const DEFAULT_CONFIG = {
    reaisPorUnidade: 5,
    bitsPorUnidade: 100,
    variacaoPorUnidade: 0.05,
    sensiMin: 0.08,
    sensiMax: 2.25,
    sensiInicial: 0.08,
    permitirFracionado: true,
    limparValorAposAplicar: true,
    manterNickPreenchido: true
  };

  let config = carregarConfig();

  let sensi = parseFloat(localStorage.getItem("sensiAtual"));
  if (!Number.isFinite(sensi)) sensi = Number(config.sensiInicial);

  let sensiAnterior = parseFloat(localStorage.getItem("sensiAnterior"));
  if (!Number.isFinite(sensiAnterior)) sensiAnterior = sensi;

  const atualEl = document.getElementById("atual");
  const anteriorEl = document.getElementById("anterior");
  const rulesLineEl = document.getElementById("rulesLine");
  const pillPixEl = document.getElementById("pillPix");
  const pillBitsEl = document.getElementById("pillBits");
  const statusTextEl = document.getElementById("statusText");

  const tituloLiveInput = document.getElementById("tituloLiveInput");
  const liveTitleDisplay = document.getElementById("liveTitleDisplay");
  const liveSetup = document.getElementById("liveSetup");
  const saveLiveBtn = document.getElementById("saveLiveBtn");
  const editLiveBtn = document.getElementById("editLiveBtn");

  const nickEl = document.getElementById("nick");
  const valorEl = document.getElementById("valor");
  const tipoEl = document.getElementById("tipo");

  const overlayEl = document.getElementById("overlay");
  const settingsPanelEl = document.getElementById("settingsPanel");
  const historyPanelEl = document.getElementById("historyPanel");
  const historyListEl = document.getElementById("historyList");
  const toastEl = document.getElementById("toast");

  function carregarConfig() {
    const salva = JSON.parse(localStorage.getItem("configSensi") || "null");
    return { ...DEFAULT_CONFIG, ...(salva || {}) };
  }

  function salvarConfig(novaConfig) {
    localStorage.setItem("configSensi", JSON.stringify(novaConfig));
  }

  function carregarHistorico() {
    return JSON.parse(localStorage.getItem("historico") || "[]");
  }

  function salvarHistoricoCompleto(historico) {
    localStorage.setItem("historico", JSON.stringify(historico));
  }

  function format3(value) {
    return Number(value).toFixed(3);
  }

  function formatMoney(value) {
    return Number(value).toFixed(2).replace(".", ",");
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showToast(texto) {
    toastEl.textContent = texto;
    toastEl.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      toastEl.classList.remove("show");
    }, 1800);
  }

  function renderSensi() {
    atualEl.textContent = format3(Number(sensi));
    anteriorEl.textContent = format3(Number(sensiAnterior));
  }

  function atualizarCardsSensi(sensiNova, sensiAntiga) {
    sensi = Number(sensiNova.toFixed(3));
    sensiAnterior = Number(sensiAntiga.toFixed(3));

    atualEl.textContent = format3(sensi);
    anteriorEl.textContent = format3(sensiAnterior);

    localStorage.setItem("sensiAtual", String(sensi));
    localStorage.setItem("sensiAnterior", String(sensiAnterior));
  }

  function renderRegras() {
    rulesLineEl.textContent =
      `Mín: ${format3(config.sensiMin)} • Máx: ${format3(config.sensiMax)} • Cada unidade muda ${format3(config.variacaoPorUnidade)}`;

    pillPixEl.textContent = `💰 A cada R$${formatMoney(config.reaisPorUnidade)} = ${format3(config.variacaoPorUnidade)}`;
    pillBitsEl.textContent = `💎 A cada ${Number(config.bitsPorUnidade)} bits = ${format3(config.variacaoPorUnidade)}`;
  }

  function renderTituloLive() {
    const titulo = localStorage.getItem("tituloLive") || "";
    if (titulo.trim()) {
      liveTitleDisplay.textContent = titulo;
      liveSetup.classList.add("hidden");
      editLiveBtn.style.display = "inline-block";
    } else {
      liveTitleDisplay.textContent = "";
      liveSetup.classList.remove("hidden");
      editLiveBtn.style.display = "none";
    }
  }

  function salvarTituloLive() {
    const titulo = tituloLiveInput.value.trim();
    if (!titulo) {
      alert("Digite o título da live.");
      return;
    }
    localStorage.setItem("tituloLive", titulo);
    tituloLiveInput.value = "";
    renderTituloLive();
    renderHistory();
  }

  function abrirOverlay() {
    overlayEl.classList.add("show");
  }

  function fecharOverlaySeNecessario() {
    const historyOpen = historyPanelEl.classList.contains("show");
    const settingsOpen = settingsPanelEl.classList.contains("show");
    if (!historyOpen && !settingsOpen) {
      overlayEl.classList.remove("show");
    }
  }

  function abrirSettings() {
    preencherFormularioConfig();
    abrirOverlay();
    settingsPanelEl.classList.add("show");
    settingsPanelEl.setAttribute("aria-hidden", "false");
  }

  function fecharSettings() {
    settingsPanelEl.classList.remove("show");
    settingsPanelEl.setAttribute("aria-hidden", "true");
    fecharOverlaySeNecessario();
  }

  function abrirHistorico() {
    renderHistory();
    abrirOverlay();
    historyPanelEl.classList.add("show");
    historyPanelEl.setAttribute("aria-hidden", "false");
  }

  function fecharHistorico() {
    historyPanelEl.classList.remove("show");
    historyPanelEl.setAttribute("aria-hidden", "true");
    fecharOverlaySeNecessario();
  }

  function fecharTudo() {
    fecharHistorico();
    fecharSettings();
  }

  function preencherFormularioConfig() {
    document.getElementById("cfgReaisPorUnidade").value = config.reaisPorUnidade;
    document.getElementById("cfgBitsPorUnidade").value = config.bitsPorUnidade;
    document.getElementById("cfgVariacaoPorUnidade").value = config.variacaoPorUnidade;
    document.getElementById("cfgSensiInicial").value = config.sensiInicial;
    document.getElementById("cfgSensiMin").value = config.sensiMin;
    document.getElementById("cfgSensiMax").value = config.sensiMax;
    document.getElementById("cfgPermitirFracionado").checked = !!config.permitirFracionado;
    document.getElementById("cfgLimparValor").checked = !!config.limparValorAposAplicar;
    document.getElementById("cfgManterNick").checked = !!config.manterNickPreenchido;
  }

  function lerFormularioConfig() {
    const nova = {
      reaisPorUnidade: parseFloat(document.getElementById("cfgReaisPorUnidade").value),
      bitsPorUnidade: parseFloat(document.getElementById("cfgBitsPorUnidade").value),
      variacaoPorUnidade: parseFloat(document.getElementById("cfgVariacaoPorUnidade").value),
      sensiInicial: parseFloat(document.getElementById("cfgSensiInicial").value),
      sensiMin: parseFloat(document.getElementById("cfgSensiMin").value),
      sensiMax: parseFloat(document.getElementById("cfgSensiMax").value),
      permitirFracionado: document.getElementById("cfgPermitirFracionado").checked,
      limparValorAposAplicar: document.getElementById("cfgLimparValor").checked,
      manterNickPreenchido: document.getElementById("cfgManterNick").checked
    };

    if (!Number.isFinite(nova.reaisPorUnidade) || nova.reaisPorUnidade <= 0) {
      throw new Error("R$ por unidade inválido.");
    }
    if (!Number.isFinite(nova.bitsPorUnidade) || nova.bitsPorUnidade <= 0) {
      throw new Error("Bits por unidade inválido.");
    }
    if (!Number.isFinite(nova.variacaoPorUnidade) || nova.variacaoPorUnidade <= 0) {
      throw new Error("Variação da sensi inválida.");
    }
    if (!Number.isFinite(nova.sensiInicial) || nova.sensiInicial < 0) {
      throw new Error("Sensi inicial inválida.");
    }
    if (!Number.isFinite(nova.sensiMin) || nova.sensiMin < 0) {
      throw new Error("Sensi mínima inválida.");
    }
    if (!Number.isFinite(nova.sensiMax) || nova.sensiMax <= 0) {
      throw new Error("Sensi máxima inválida.");
    }
    if (nova.sensiMax < nova.sensiMin) {
      throw new Error("A sensi máxima não pode ser menor que a mínima.");
    }

    return nova;
  }

  function aplicarNovaConfig() {
    try {
      const nova = lerFormularioConfig();
      config = nova;
      salvarConfig(config);

      if (sensi < config.sensiMin) sensi = config.sensiMin;
      if (sensi > config.sensiMax) sensi = config.sensiMax;
      if (sensiAnterior < config.sensiMin) sensiAnterior = config.sensiMin;
      if (sensiAnterior > config.sensiMax) sensiAnterior = config.sensiMax;

      sensi = Number(sensi.toFixed(3));
      sensiAnterior = Number(sensiAnterior.toFixed(3));

      localStorage.setItem("sensiAtual", String(sensi));
      localStorage.setItem("sensiAnterior", String(sensiAnterior));

      renderSensi();
      renderRegras();
      fecharSettings();
      statusTextEl.textContent = "Configurações salvas com sucesso.";
      showToast("Configurações salvas");
    } catch (erro) {
      alert(erro.message);
    }
  }

  function calcularVariacao(valor, tipoDoacao) {
    let unidades;

    if (tipoDoacao === "bits") {
      unidades = valor / config.bitsPorUnidade;
    } else {
      unidades = valor / config.reaisPorUnidade;
    }

    if (!config.permitirFracionado) {
      unidades = Math.floor(unidades);
    }

    return unidades * config.variacaoPorUnidade;
  }

  function gerarMensagem({ nick, valor, tipoDoacao, direcao, variacao, sensiFinal }) {
    const doacaoTexto =
      tipoDoacao === "bits"
        ? `💎 ${valor} bits`
        : `💰 R$${Number(valor).toFixed(2).replace(".", ",")}`;

    const acao = direcao === "up" ? "subiu" : "desceu";
    const sinal = direcao === "up" ? "+" : "-";

    return `${nick} • ${doacaoTexto} • ${acao} ${sinal}${format3(variacao)} • sensi atual ${format3(sensiFinal)}`;
  }

  function salvarRegistroNoHistorico({ nick, valor, tipoDoacao, direcao, variacao, sensiAntes, sensiFinal }) {
    const historico = carregarHistorico();
    const titulo = localStorage.getItem("tituloLive") || "Sem título";
    const dataHoje = new Date().toLocaleDateString("pt-BR");

    const registro = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      nick,
      valor: Number(valor),
      tipoDoacao,
      direcao,
      variacao: Number(variacao.toFixed(3)),
      sensiAntes: Number(sensiAntes.toFixed(3)),
      sensiFinal: Number(sensiFinal.toFixed(3)),
      dataHora: new Date().toLocaleString("pt-BR")
    };

    let live = historico.find(item => item.titulo === titulo && item.data === dataHoje);

    if (!live) {
      live = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        titulo,
        data: dataHoje,
        registros: []
      };
      historico.unshift(live);
    }

    live.registros.unshift(registro);
    salvarHistoricoCompleto(historico);
  }

  function aplicarMudanca(direcao) {
    const titulo = localStorage.getItem("tituloLive");
    if (!titulo) {
      alert("Defina o título da live primeiro.");
      return;
    }

    const nick = nickEl.value.trim() || "Anônimo";
    const valor = parseFloat(valorEl.value);
    const tipoDoacao = tipoEl.value;

    if (!Number.isFinite(valor) || valor <= 0) {
      alert("Digite um valor válido.");
      return;
    }

    const variacao = calcularVariacao(valor, tipoDoacao);

    if (!Number.isFinite(variacao) || variacao <= 0) {
      alert("Esse valor não gera alteração com a regra atual.");
      return;
    }

    const sensiAntesDaMudanca = Number(sensi.toFixed(3));
    let novaSensi = sensiAntesDaMudanca;

    if (direcao === "up") {
      novaSensi += variacao;
    } else {
      novaSensi -= variacao;
    }

    if (novaSensi > config.sensiMax) novaSensi = config.sensiMax;
    if (novaSensi < config.sensiMin) novaSensi = config.sensiMin;

    atualizarCardsSensi(novaSensi, sensiAntesDaMudanca);

    const mensagem = gerarMensagem({
      nick,
      valor,
      tipoDoacao,
      direcao,
      variacao,
      sensiFinal: sensi
    });

    statusTextEl.textContent = mensagem;

    salvarRegistroNoHistorico({
      nick,
      valor,
      tipoDoacao,
      direcao,
      variacao,
      sensiAntes: sensiAntesDaMudanca,
      sensiFinal: sensi
    });

    renderHistory();

    if (config.limparValorAposAplicar) {
      valorEl.value = "";
    }

    if (!config.manterNickPreenchido) {
      nickEl.value = "";
    }

    if (config.manterNickPreenchido) {
      valorEl.focus();
    } else {
      nickEl.focus();
    }
  }

  function renderHistory() {
    const historico = carregarHistorico();

    if (!historico.length) {
      historyListEl.innerHTML = '<div class="history-empty">Nenhum histórico salvo ainda.</div>';
      return;
    }

    historyListEl.innerHTML = historico.map((live, liveIndex) => {
      const recordsHtml = (live.registros || []).map((registro, regIndex) => {
        const doacao = registro.tipoDoacao === "bits"
          ? `💎 ${registro.valor} bits`
          : `💰 R$${Number(registro.valor).toFixed(2).replace(".", ",")}`;

        const variacao = `${registro.direcao === "up" ? "🟢 +" : "🔴 -"}${Number(registro.variacao).toFixed(3)}`;

        return `
          <div class="record">
            <div class="record-grid">
              <div class="item">
                <div class="item-label">Pessoa</div>
                <div class="item-value">👤 ${escapeHtml(registro.nick)}</div>
              </div>

              <div class="item">
                <div class="item-label">Doação</div>
                <div class="item-value">${doacao}</div>
              </div>

              <div class="item">
                <div class="item-label">Mudança</div>
                <div class="item-value">${variacao}</div>
              </div>

              <div class="item">
                <div class="item-label">Sensi atual</div>
                <div class="item-value">🎯 ${Number(registro.sensiFinal).toFixed(3)}</div>
              </div>
            </div>

            <div class="record-footer">
              <div class="time">${escapeHtml(registro.dataHora || "")}</div>

              <div class="record-actions">
                <button class="mini-btn copy-live-btn" type="button" onclick="copiarRegistro(${liveIndex}, ${regIndex})">📋 Copiar</button>
                <button class="mini-btn delete-btn" type="button" onclick="excluirRegistro(${liveIndex}, ${regIndex})">🗑️ Excluir</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="live-card" data-live-index="${liveIndex}">
          <button class="live-header" type="button" onclick="toggleLive(${liveIndex})">
            <div class="live-left">
              <div class="arrow">▶</div>
              <div class="live-title-group">
                <div class="live-name">${escapeHtml(live.titulo)}</div>
                <div class="live-date">${escapeHtml(live.data)}</div>
              </div>
            </div>

            <div class="live-count">${(live.registros || []).length} registro(s)</div>
          </button>

          <div class="live-content">
            ${recordsHtml || '<div class="history-empty">Nenhum registro nesta live.</div>'}
          </div>
        </div>
      `;
    }).join("");
  }

  function toggleLive(index) {
    const card = document.querySelector(`[data-live-index="${index}"]`);
    if (card) card.classList.toggle("open");
  }

  function copiarTexto(texto, mensagem = "Copiado") {
    navigator.clipboard.writeText(texto)
      .then(() => showToast(mensagem))
      .catch(() => alert("Não foi possível copiar."));
  }

  function copiarUltimaAcao() {
    const texto = statusTextEl.textContent.trim();
    if (!texto || texto === "Nenhuma alteração aplicada ainda.") {
      alert("Não há última ação para copiar.");
      return;
    }
    copiarTexto(texto, "Última ação copiada");
  }

  function copiarRegistro(liveIndex, regIndex) {
    const historico = carregarHistorico();
    const live = historico[liveIndex];
    if (!live) return;
    const registro = live.registros[regIndex];
    if (!registro) return;

    const doacaoTexto =
      registro.tipoDoacao === "bits"
        ? `💎 ${registro.valor} bits`
        : `💰 R$${Number(registro.valor).toFixed(2).replace(".", ",")}`;

    const acao = registro.direcao === "up" ? "subiu" : "desceu";
    const sinal = registro.direcao === "up" ? "+" : "-";

    const texto = `${registro.nick} • ${doacaoTexto} • ${acao} ${sinal}${Number(registro.variacao).toFixed(3)} • sensi atual ${Number(registro.sensiFinal).toFixed(3)}`;
    copiarTexto(texto, "Registro copiado");
  }

  function copiarTudo() {
    const historico = carregarHistorico();

    if (!historico.length) {
      alert("Não há histórico para copiar.");
      return;
    }

    const texto = historico.map(live => {
      const bloco = (live.registros || []).map(r => {
        const doacao = r.tipoDoacao === "bits"
          ? `💎 ${r.valor} bits`
          : `💰 R$${Number(r.valor).toFixed(2).replace(".", ",")}`;
        const variacao = `${r.direcao === "up" ? "+" : "-"}${Number(r.variacao).toFixed(3)}`;
        return `• ${r.nick} | ${doacao} | ${variacao} | sensi ${Number(r.sensiFinal).toFixed(3)}`;
      }).join("\n");

      return `${live.titulo} - ${live.data}\n${bloco}`;
    }).join("\n\n");

    copiarTexto(texto, "Histórico copiado");
  }

  function copiarLiveAtual() {
    const historico = carregarHistorico();
    const tituloAtual = localStorage.getItem("tituloLive") || "";
    const dataHoje = new Date().toLocaleDateString("pt-BR");

    const live = historico.find(item => item.titulo === tituloAtual && item.data === dataHoje);

    if (!live || !(live.registros || []).length) {
      alert("Não há registros da live atual para copiar.");
      return;
    }

    const texto = [
      `${live.titulo} - ${live.data}`,
      ...live.registros.map(r => {
        const doacao = r.tipoDoacao === "bits"
          ? `💎 ${r.valor} bits`
          : `💰 R$${Number(r.valor).toFixed(2).replace(".", ",")}`;
        const variacao = `${r.direcao === "up" ? "+" : "-"}${Number(r.variacao).toFixed(3)}`;
        return `• ${r.nick} | ${doacao} | ${variacao} | sensi ${Number(r.sensiFinal).toFixed(3)}`;
      })
    ].join("\n");

    copiarTexto(texto, "Live atual copiada");
  }

  function excluirRegistro(liveIndex, regIndex) {
    const historico = carregarHistorico();
    const live = historico[liveIndex];
    if (!live) return;

    const registro = live.registros[regIndex];
    if (!registro) return;

    const confirmar = confirm(`Excluir o registro de ${registro.nick}?`);
    if (!confirmar) return;

    live.registros.splice(regIndex, 1);

    if (!live.registros.length) {
      historico.splice(liveIndex, 1);
    }

    salvarHistoricoCompleto(historico);
    renderHistory();
    showToast("Registro excluído");
  }

  function limparTudo() {
    const historico = carregarHistorico();
    if (!historico.length) {
      alert("Não há histórico para apagar.");
      return;
    }

    const confirmar = confirm("Apagar todo o histórico?");
    if (!confirmar) return;

    localStorage.removeItem("historico");
    renderHistory();
    showToast("Histórico apagado");
  }

  saveLiveBtn.addEventListener("click", salvarTituloLive);
  tituloLiveInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") salvarTituloLive();
  });

  editLiveBtn.addEventListener("click", () => {
    const atual = localStorage.getItem("tituloLive") || "";
    tituloLiveInput.value = atual;
    localStorage.removeItem("tituloLive");
    renderTituloLive();
    tituloLiveInput.focus();
  });

  document.getElementById("btnSubir").addEventListener("click", () => aplicarMudanca("up"));
  document.getElementById("btnDescer").addEventListener("click", () => aplicarMudanca("down"));

  document.getElementById("btnHistorico").addEventListener("click", abrirHistorico);
  document.getElementById("openHistoryBtn").addEventListener("click", abrirHistorico);
  document.getElementById("closeHistoryBtn").addEventListener("click", fecharHistorico);
  document.getElementById("closeHistoryX").addEventListener("click", fecharHistorico);

  document.getElementById("openSettingsBtn").addEventListener("click", abrirSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click", fecharSettings);
  document.getElementById("closeSettingsX").addEventListener("click", fecharSettings);
  document.getElementById("saveSettingsBtn").addEventListener("click", aplicarNovaConfig);

  document.getElementById("copyLastActionBtn").addEventListener("click", copiarUltimaAcao);
  document.getElementById("copyAllHistoryBtn").addEventListener("click", copiarTudo);
  document.getElementById("clearHistoryBtn").addEventListener("click", limparTudo);
  document.getElementById("copyCurrentLiveBtn").addEventListener("click", copiarLiveAtual);

  overlayEl.addEventListener("click", fecharTudo);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") fecharTudo();
  });

  renderSensi();
  renderRegras();
  renderTituloLive();
  renderHistory();
</script>
</body>
</html>
